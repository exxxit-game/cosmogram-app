name: Cosmogram CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }} # 🔥 Используем токен для доступа
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' # 🔥 Обновляем до Node.js 22
        cache: 'npm'
    
    - name: Install Puppeteer (Headless Browser)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgbm1 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgtk-3-0 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libasound2
        npm ci --ignore-scripts || npm install --save-dev puppeteer
    
    - name: Run Tests
      run: node tests/run-ci.js
      env:
        CI: true
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results.json
        retention-days: 7
