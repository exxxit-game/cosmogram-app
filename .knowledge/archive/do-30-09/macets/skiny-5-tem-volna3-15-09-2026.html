<title>Макет: 5 новых скинов — волна 3</title>
<style>
:root{ --bg:#0b0e1a; --panel:#12172a; --panel-edge:#232c4a; --text:#e8ecf7; --text-dim:#8b93b3; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px}
h1{font-size:18px;margin:0 0 4px}
p.sub{color:var(--text-dim);font-size:12px;max-width:900px;margin:0 0 20px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:1100px}
.card{background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:12px;text-align:center}
.card canvas{width:100%;aspect-ratio:1;border-radius:10px;background:linear-gradient(180deg,#0a0e29 0%,#0e1a2a 55%,#0a1420 100%)}
.name{font-size:12px;font-weight:700;margin-top:8px}
.fact{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.4}
.src{font-size:9px;color:#5a6488;margin-top:3px}
</style>
<h1>5 новых скинов — волна 3 («Науки для тюнинга»)</h1>
<p class="sub">Продолжение (волна 1 и 2 ждут «да»). Эти пять — уже реально исследованные темы (роза-окно/Хладни/Бентли — Уровень 1-2 приоритетного списка), только ещё не показанные как отдельный макет корпуса.</p>
<div class="grid" id="grid"></div>
<script>
const BODY_PTS=[[0,-22],[-16,14],[0,6],[16,14]];
function clipBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.clip(); }
function fillBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.fill(); }
function edgeStroke(ctx){
  ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1.1;
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.lineTo(-16,14); ctx.moveTo(0,-22); ctx.lineTo(16,14);
  ctx.moveTo(-16,14); ctx.lineTo(0,6); ctx.moveTo(0,6); ctx.lineTo(16,14);
  ctx.stroke();
}
function mountCards(items){
  const grid=document.getElementById('grid');
  items.forEach(({id,name,body,drawFn,zoom,fact,src})=>{
    const card=document.createElement('div'); card.className='card';
    const cv=document.createElement('canvas'); cv.id=id;
    const nm=document.createElement('div'); nm.className='name'; nm.textContent=name;
    const ft=document.createElement('div'); ft.className='fact'; ft.textContent=fact;
    const sr=document.createElement('div'); sr.className='src'; sr.textContent=src;
    card.appendChild(cv); card.appendChild(nm); card.appendChild(ft); card.appendChild(sr);
    grid.appendChild(card);
    loopFlash(cv,body,drawFn,zoom);
  });
}
function loopFlash(cv,bodyColor,drawFn,zoom){
  const ctx=cv.getContext('2d');
  function frame(now){
    const w=cv.clientWidth||160, h=cv.clientHeight||160;
    const dpr=Math.min(devicePixelRatio||1,2);
    if(cv._lw!==w||cv._lh!==h||cv._ld!==dpr){ cv.width=w*dpr; cv.height=h*dpr; cv._lw=w; cv._lh=h; cv._ld=dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    ctx.save(); ctx.translate(w/2,h/2); ctx.scale(zoom,zoom);
    ctx.save(); clipBody(ctx);
    const g=ctx.createLinearGradient(0,-22,0,16);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.45,bodyColor); g.addColorStop(1,'#0e1018');
    ctx.fillStyle=g; fillBody(ctx);
    ctx.restore();
    ctx.save(); clipBody(ctx); ctx.translate(0,-4);
    drawFn(ctx,now);
    ctx.restore();
    edgeStroke(ctx);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// 1. Готическая роза-окно — радиальная симметрия, 8-12 лепестков
function drawRoseWindow(ctx,now){
  const spin=now/9000, n=10;
  ctx.save(); ctx.rotate(spin);
  for(let i=0;i<n;i++){
    const a=i/n*6.283;
    ctx.save(); ctx.rotate(a);
    ctx.fillStyle=`hsla(${(i*36+now/40)%360},70%,60%,.55)`;
    ctx.beginPath(); ctx.ellipse(0,-4.2,1.3,2.6,0,0,6.283); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=0.18; ctx.stroke();
    ctx.restore();
  }
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=0.25;
  ctx.beginPath(); ctx.arc(0,0,1.4,0,6.283); ctx.stroke();
  ctx.restore();
}
// 2. Фигуры Хладни — узловые линии на колеблющейся пластине
function drawChladni(ctx,now){
  const m=3,n=4, t=now/1800;
  const nx=8*2+1, ny=8*2+1;
  for(let ix=0;ix<nx;ix++){
    for(let iy=0;iy<ny;iy++){
      const x=(ix-nx/2)/(nx/2)*8, y=(iy-ny/2)/(ny/2)*8;
      const val=Math.sin(m*Math.PI*(x+8)/16)*Math.sin(n*Math.PI*(y+8)/16) - Math.sin(n*Math.PI*(x+8)/16)*Math.sin(m*Math.PI*(y+8)/16);
      if(Math.abs(val)<0.06){
        ctx.fillStyle=`rgba(255,255,255,${0.5+0.4*Math.sin(t+ix*0.3)})`;
        ctx.fillRect(x-0.12,y-0.12,0.24,0.24);
      }
    }
  }
}
// 3. Снежный кристалл — Бентли/Накая, 6-лучевая симметрия дендрита
function drawSnowCrystal(ctx,now){
  const spin=now/12000;
  ctx.save(); ctx.rotate(spin);
  for(let arm=0;arm<6;arm++){
    ctx.save(); ctx.rotate(arm/6*6.283);
    ctx.strokeStyle='rgba(220,240,255,.85)'; ctx.lineWidth=0.35;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-8); ctx.stroke();
    for(let i=1;i<=4;i++){
      const yy=-i*1.7;
      const len=1.4-(i*0.18);
      ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(len,yy-len*0.8); ctx.moveTo(0,yy); ctx.lineTo(-len,yy-len*0.8); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}
// 4. Танцы планет — пентаграмма резонанса Земля-Венера 13:8
function drawVenusPentagram(ctx,now){
  const drift=now/40000; // очень медленная прецессия
  ctx.save(); ctx.rotate(drift);
  const pts=[]; for(let i=0;i<5;i++){ const a=i/5*6.283-1.5708; pts.push([Math.cos(a)*7,Math.sin(a)*7]); }
  ctx.strokeStyle='hsla(330,80%,70%,.8)'; ctx.lineWidth=0.35;
  ctx.beginPath();
  for(let i=0;i<5;i++){ const [x,y]=pts[(i*2)%5]; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.closePath(); ctx.stroke();
  const t=(now%4000)/4000;
  const a=t*6.283*8/13*5-1.5708;
  ctx.fillStyle='rgba(255,220,150,1)';
  ctx.beginPath(); ctx.arc(Math.cos(a)*7,Math.sin(a)*7,0.5,0,6.283); ctx.fill();
  ctx.restore();
}
// 5. Семейство многогранников — усечённый икосаэдр (футбольный мяч), Архимед/Джонсон
function drawArchimedean(ctx,now){
  const spin=now/6000;
  ctx.save(); ctx.rotate(spin);
  for(let ring=0;ring<3;ring++){
    const r=2.2+ring*2.1, n=5+ring;
    ctx.strokeStyle=`hsla(${160+ring*40},60%,65%,.65)`; ctx.lineWidth=0.28;
    ctx.beginPath();
    for(let i=0;i<=n;i++){ const a=i/n*6.283+ring*0.4; const x=Math.cos(a)*r, y=Math.sin(a)*r*0.85; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(0,0,0.6,0,6.283); ctx.fill();
}

mountCards([
  {id:'w3a', name:'Готическая роза-окно', body:'#1a1408', drawFn:drawRoseWindow, zoom:6.5,
   fact:'Розетта Шартра — Ø12м, окно строится циркулем и линейкой без осей вращения',
   src:'STAINED-GLASS.md + GENERATIVE-GEOMETRY.md'},
  {id:'w3b', name:'Фигуры Хладни', body:'#0a0a0e', drawFn:drawChladni, zoom:6.5,
   fact:'Эрнст Хладни, 1787 год — портрет частоты колебания пластины, показан лично Наполеону',
   src:'GENERATIVE-GEOMETRY.md'},
  {id:'w3c', name:'Снежный кристалл', body:'#0a1420', drawFn:drawSnowCrystal, zoom:6.5,
   fact:'Вильсон Бентли — первое фото снежинки 1885, 5000+ снимков за 46 лет',
   src:'SNOW-CRYSTAL-SCIENCE.md'},
  {id:'w3d', name:'Танцы планет', body:'#140a18', drawFn:drawVenusPentagram, zoom:6.5,
   fact:'Резонанс 13:8 Земля-Венера рисует пентаграмму, прецессия — 1/5 оборота за ~240 лет',
   src:'PLANETARY-DANCE-PATTERNS.md'},
  {id:'w3e', name:'Семейство многогранников', body:'#0e1810', drawFn:drawArchimedean, zoom:6.5,
   fact:'Усечённый икосаэдр (60В/90Р/32Г) = структура фуллерена C₆₀',
   src:'ARCHIMEDEAN-JOHNSON-SOLIDS.md'},
]);
</script>
