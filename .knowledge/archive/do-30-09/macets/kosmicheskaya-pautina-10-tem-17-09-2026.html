<title>Макет: космическая паутина — 10 тем</title>
<style>
:root{ --bg:#0b0e1a; --panel:#12172a; --panel-edge:#232c4a; --text:#e8ecf7; --text-dim:#8b93b3; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px}
h1{font-size:18px;margin:0 0 4px}
p.sub{color:var(--text-dim);font-size:12px;max-width:900px;margin:0 0 20px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:1100px}
.card{background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:12px;text-align:center}
.card canvas{width:100%;aspect-ratio:1;border-radius:10px;background:linear-gradient(180deg,#0a0e29 0%,#0e1a2a 55%,#0a1420 100%)}
.name{font-size:12px;font-weight:700;margin-top:8px}
.fact{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.4}
</style>
<h1>Космическая паутина — 10 тем (COSMIC-PHENOMENA.md + WebSearch 17.09.2026)</h1>
<p class="sub">Тема 8 из 10. Крупнейший масштаб из всей партии — не отдельные объекты, а структура самой Вселенной: нити тёмной материи, пустоты, Стена Слоуна, наш дом Ланиакея.</p>
<div class="grid" id="grid"></div>
<script>
const BODY_PTS=[[0,-22],[-16,14],[0,6],[16,14]];
function clipBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.clip(); }
function fillBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.fill(); }
function edgeStroke(ctx){
  ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1.1;
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.lineTo(-16,14); ctx.moveTo(0,-22); ctx.lineTo(16,14);
  ctx.moveTo(-16,14); ctx.lineTo(0,6); ctx.moveTo(0,6); ctx.lineTo(16,14);
  ctx.stroke();
}
function mountCards(items){
  const grid=document.getElementById('grid');
  items.forEach(({id,name,body,drawFn,zoom,fact})=>{
    const card=document.createElement('div'); card.className='card';
    const cv=document.createElement('canvas'); cv.id=id;
    const nm=document.createElement('div'); nm.className='name'; nm.textContent=name;
    const ft=document.createElement('div'); ft.className='fact'; ft.textContent=fact;
    card.appendChild(cv); card.appendChild(nm); card.appendChild(ft);
    grid.appendChild(card);
    loopFlash(cv,body,drawFn,zoom);
  });
}
function loopFlash(cv,bodyColor,drawFn,zoom){
  const ctx=cv.getContext('2d');
  function frame(now){
    const w=cv.clientWidth||160, h=cv.clientHeight||160;
    const dpr=Math.min(devicePixelRatio||1,2);
    if(cv._lw!==w||cv._lh!==h||cv._ld!==dpr){ cv.width=w*dpr; cv.height=h*dpr; cv._lw=w; cv._lh=h; cv._ld=dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    ctx.save(); ctx.translate(w/2,h/2); ctx.scale(zoom,zoom);
    ctx.save(); clipBody(ctx);
    const g=ctx.createLinearGradient(0,-22,0,16);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.45,bodyColor); g.addColorStop(1,'#0e1018');
    ctx.fillStyle=g; fillBody(ctx);
    ctx.restore();
    ctx.save(); clipBody(ctx); ctx.translate(0,-4);
    drawFn(ctx,now);
    ctx.restore();
    edgeStroke(ctx);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
// 1. Структура паутины — узлы (скопления) связаны нитями, галактики как бусины на нити
function drawCosmicWebStructure(ctx,now){
  const nodes=[[-4,-5],[3,-6],[-2,-1],[4,1],[-4,3],[1,4]];
  const edges=[[0,2],[1,2],[2,3],[2,4],[3,5],[4,5]];
  ctx.strokeStyle='hsla(220,50%,65%,.35)'; ctx.lineWidth=0.3;
  edges.forEach(([a,b])=>{ ctx.beginPath(); ctx.moveTo(nodes[a][0],nodes[a][1]-2); ctx.lineTo(nodes[b][0],nodes[b][1]-2); ctx.stroke(); });
  nodes.forEach(([x,y],i)=>{ const p=0.5+0.5*Math.sin(now/500+i); ctx.fillStyle='hsla(45,80%,75%,'+(0.5+p*0.3)+')'; ctx.beginPath(); ctx.arc(x,y-2,0.35,0,6.283); ctx.fill(); });
}
// 2. Пустоты — гигантские почти пустые области между нитями, десятки мегапарсек
function drawCosmicVoids(ctx,now){
  ctx.strokeStyle='hsla(220,30%,50%,.2)'; ctx.lineWidth=0.3;
  ctx.beginPath(); ctx.arc(0,-2,4.5,0,6.283); ctx.stroke();
  const rim=[[0,-6.5],[4,-2],[0,2.5],[-4,-2],[2.8,-4.8],[-2.8,-4.8],[2.8,0.8],[-2.8,0.8]];
  rim.forEach(([x,y],i)=>{ const p=0.5+0.5*Math.sin(now/500+i); ctx.fillStyle='hsla(45,70%,'+(65+p*15)+'%,'+(0.35+p*0.3)+')'; ctx.beginPath(); ctx.arc(x,y,0.25,0,6.283); ctx.fill(); });
}
// 3. Обзор SDSS — сканирующий срез неба картографирует структуру
function drawSDSSSurvey(ctx,now){
  const p=(now%3000)/3000;
  ctx.strokeStyle='hsla(200,60%,65%,.4)'; ctx.lineWidth=0.3;
  ctx.beginPath(); ctx.moveTo(-6,-2+p*0.5); ctx.lineTo(6,-2+p*0.5); ctx.stroke();
  for(let i=0;i<10;i++){ ctx.fillStyle='hsla(45,70%,70%,.5)'; ctx.beginPath(); ctx.arc(-6+i*1.3,-2+Math.sin(i*1.7)*1.5,0.18,0,6.283); ctx.fill(); }
}
// 4. Стена Слоуна — крупнейшая известная непрерывная структура, ≈1 млрд световых лет
function drawSloanGreatWall(ctx,now){
  for(let i=0;i<24;i++){
    const t=(i/24-0.5)*8;
    const p=0.5+0.5*Math.sin(now/500+i*0.3);
    ctx.fillStyle='hsla(45,70%,'+(60+p*15)+'%,.6)';
    ctx.beginPath(); ctx.arc(t,-2+Math.sin(t*0.7)*0.8,0.16,0,6.283); ctx.fill();
  }
}
// 5. Ланиакея — наш дом, ~100000 галактик, 520 млн световых лет, потоки сходятся
function drawLaniakea(ctx,now){
  const p=(now%4000)/4000;
  for(let i=0;i<6;i++){
    const a=i/6*6.283;
    ctx.strokeStyle='hsla(45,70%,70%,.3)'; ctx.lineWidth=0.35;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*6,-2+Math.sin(a)*6*0.6); ctx.lineTo(0,-2); ctx.stroke();
  }
  ctx.fillStyle='hsla(45,80%,80%,'+(0.6+0.3*Math.sin(now/400))+')'; ctx.beginPath(); ctx.arc(0,-2,0.5,0,6.283); ctx.fill();
}
// 6. Карта флуктуаций реликтового излучения — детский снимок Вселенной, текстурный узор
function drawCMBMap(ctx,now){
  const seeds=[[-3,-4,1],[2,-5,0.8],[-1,-1,1.2],[3,1,0.7],[-4,2,0.9],[1,3.5,1],[-2,-2.5,0.6]];
  seeds.forEach(([dx,dy,rr],i)=>{
    const p=0.5+0.5*Math.sin(now/450+i*1.7);
    ctx.fillStyle='hsla('+(20+i*30)+',50%,60%,'+(0.2+p*0.2)+')';
    ctx.beginPath(); ctx.arc(dx,dy-2,rr*(0.85+p*0.2),0,6.283); ctx.fill();
  });
}
// 7. Волна плотности спиральных рукавов (Лин-Шу) — рукав это волна сжатия, едущая медленнее звёзд
function drawDensityWave(ctx,now){
  const rot=now/4000;
  for(let arm=0;arm<2;arm++){
    for(let t=0;t<10;t++){
      const th=t/10*3;
      const r=1+th*2;
      const a=rot+arm*Math.PI+th*1.4;
      ctx.fillStyle='hsla(220,50%,70%,'+(0.5-t*0.04)+')';
      ctx.beginPath(); ctx.arc(Math.cos(a)*r*0.6,-2+Math.sin(a)*r*0.5,0.35,0,6.283); ctx.fill();
    }
  }
}
// 8. Тёмная материя-каркас — нити в основном невидимая тёмная материя, галактики лишь "светятся" в узлах
function drawDarkMatterScaffold(ctx,now){
  ctx.strokeStyle='hsla(260,30%,50%,.25)'; ctx.lineWidth=0.6;
  ctx.beginPath(); ctx.moveTo(-5,-6); ctx.lineTo(5,2); ctx.moveTo(-5,2); ctx.lineTo(5,-6); ctx.stroke();
  const p=0.5+0.5*Math.sin(now/500);
  ctx.fillStyle='hsla(45,80%,75%,'+(0.5+p*0.3)+')'; ctx.beginPath(); ctx.arc(0,-2,0.4,0,6.283); ctx.fill();
}
// 9. Узел-скопление галактик — плотный сгусток на пересечении нитей паутины
function drawGalaxyClusterNode(ctx,now){
  const seeds=[[0,0],[0.8,-0.5],[-0.7,0.6],[0.3,0.9],[-0.9,-0.4],[1.1,0.4]];
  seeds.forEach(([dx,dy],i)=>{
    const p=0.5+0.5*Math.sin(now/400+i);
    ctx.fillStyle='hsla(45,75%,'+(65+p*15)+'%,.7)'; ctx.beginPath(); ctx.arc(dx,dy-2,0.3,0,6.283); ctx.fill();
  });
}
// 10. Великий аттрактор — реальная гравитационная аномалия, тянущая галактики к скрытой точке
function drawGreatAttractor(ctx,now){
  const p=(now%2500)/2500;
  for(let i=0;i<8;i++){
    const a=i/8*6.283;
    const rr=6-p*4.5;
    ctx.fillStyle='hsla(200,50%,70%,'+(0.15+ (1-rr/6)*0.4)+')';
    ctx.beginPath(); ctx.arc(Math.cos(a)*rr,-2+Math.sin(a)*rr*0.5,0.25,0,6.283); ctx.fill();
  }
}

mountCards([
  {id:'w1', name:'Структура паутины', body:'#0c1220', drawFn:drawCosmicWebStructure, zoom:6, fact:'Скопления-узлы связаны нитями — галактики как бусины на нити'},
  {id:'w2', name:'Космические пустоты', body:'#0a0e1c', drawFn:drawCosmicVoids, zoom:6, fact:'Почти пустые области в десятки мегапарсек между нитями'},
  {id:'w3', name:'Обзор SDSS', body:'#0e1220', drawFn:drawSDSSSurvey, zoom:6, fact:'Настоящий обзор неба, впервые нанёсший паутину на карту'},
  {id:'w4', name:'Стена Слоуна', body:'#12100a', drawFn:drawSloanGreatWall, zoom:6, fact:'≈1 млрд световых лет — крупнейшая известная непрерывная структура'},
  {id:'w5', name:'Ланиакея — наш дом', body:'#14100a', drawFn:drawLaniakea, zoom:6, fact:'~100000 галактик, 520 млн световых лет — назван в 2014'},
  {id:'w6', name:'Карта реликтового излучения', body:'#100c14', drawFn:drawCMBMap, zoom:6, fact:'«Детский снимок Вселенной» — 380000 лет после Большого взрыва'},
  {id:'w7', name:'Волна плотности рукавов', body:'#0c1420', drawFn:drawDensityWave, zoom:6, fact:'Рукав — волна сжатия едет медленнее звёзд, как затор на дороге'},
  {id:'w8', name:'Каркас тёмной материи', body:'#100c1c', drawFn:drawDarkMatterScaffold, zoom:6, fact:'Нити в основном невидимы — галактики лишь светятся в узлах'},
  {id:'w9', name:'Узел-скопление', body:'#12100a', drawFn:drawGalaxyClusterNode, zoom:6.5, fact:'Плотный сгусток галактик там, где пересекаются нити'},
  {id:'w10', name:'Великий аттрактор', body:'#0c1220', drawFn:drawGreatAttractor, zoom:6, fact:'Реальная гравитационная аномалия тянет к себе целые галактики'},
]);
</script>
