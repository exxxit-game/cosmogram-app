<title>Макет: метеоры и метеориты — 10 тем</title>
<style>
:root{ --bg:#0b0e1a; --panel:#12172a; --panel-edge:#232c4a; --text:#e8ecf7; --text-dim:#8b93b3; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px}
h1{font-size:18px;margin:0 0 4px}
p.sub{color:var(--text-dim);font-size:12px;max-width:900px;margin:0 0 20px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:1100px}
.card{background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:12px;text-align:center}
.card canvas{width:100%;aspect-ratio:1;border-radius:10px;background:linear-gradient(180deg,#0a0e29 0%,#0e1a2a 55%,#0a1420 100%)}
.name{font-size:12px;font-weight:700;margin-top:8px}
.fact{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.4}
</style>
<h1>Метеоры и метеориты — 10 тем (METEOR-METEORITE-SCIENCE.md)</h1>
<p class="sub">Тема 5 из 10. Геометрия радианта (оптическая иллюзия точки схода) + реальная классификация упавших камней по составу — три честно разных класса, три разные истории.</p>
<div class="grid" id="grid"></div>
<script>
const BODY_PTS=[[0,-22],[-16,14],[0,6],[16,14]];
function clipBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.clip(); }
function fillBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.fill(); }
function edgeStroke(ctx){
  ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1.1;
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.lineTo(-16,14); ctx.moveTo(0,-22); ctx.lineTo(16,14);
  ctx.moveTo(-16,14); ctx.lineTo(0,6); ctx.moveTo(0,6); ctx.lineTo(16,14);
  ctx.stroke();
}
function mountCards(items){
  const grid=document.getElementById('grid');
  items.forEach(({id,name,body,drawFn,zoom,fact})=>{
    const card=document.createElement('div'); card.className='card';
    const cv=document.createElement('canvas'); cv.id=id;
    const nm=document.createElement('div'); nm.className='name'; nm.textContent=name;
    const ft=document.createElement('div'); ft.className='fact'; ft.textContent=fact;
    card.appendChild(cv); card.appendChild(nm); card.appendChild(ft);
    grid.appendChild(card);
    loopFlash(cv,body,drawFn,zoom);
  });
}
function loopFlash(cv,bodyColor,drawFn,zoom){
  const ctx=cv.getContext('2d');
  function frame(now){
    const w=cv.clientWidth||160, h=cv.clientHeight||160;
    const dpr=Math.min(devicePixelRatio||1,2);
    if(cv._lw!==w||cv._lh!==h||cv._ld!==dpr){ cv.width=w*dpr; cv.height=h*dpr; cv._lw=w; cv._lh=h; cv._ld=dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    ctx.save(); ctx.translate(w/2,h/2); ctx.scale(zoom,zoom);
    ctx.save(); clipBody(ctx);
    const g=ctx.createLinearGradient(0,-22,0,16);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.45,bodyColor); g.addColorStop(1,'#0e1018');
    ctx.fillStyle=g; fillBody(ctx);
    ctx.restore();
    ctx.save(); clipBody(ctx); ctx.translate(0,-4);
    drawFn(ctx,now);
    ctx.restore();
    edgeStroke(ctx);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
// 1. Геометрия радианта — параллельные метеоры визуально сходятся в одну точку (иллюзия перспективы, как рельсы)
function drawRadiantGeometry(ctx,now){
  const p=(now%2000)/2000;
  for(let i=0;i<7;i++){
    const off=(i-3)*1.4;
    const streak=(p+i*0.13)%1;
    ctx.strokeStyle='hsla(45,90%,80%,'+(0.15+0.35*(1-streak))+')'; ctx.lineWidth=0.4;
    ctx.beginPath(); ctx.moveTo(off*4,7); ctx.lineTo(off*0.3,-8+streak*4); ctx.stroke();
  }
}
// 2. Хондриты — 94% падений, нетронутое вещество ранней Солнечной системы, хондры внутри
function drawChondrite(ctx,now){
  ctx.fillStyle='hsla(30,25%,35%,1)'; ctx.beginPath(); ctx.arc(0,-2,6,0,6.283); ctx.fill();
  const seeds=[[-2,-4],[1,-2],[3,-3],[-3,0],[0,1],[2.5,1.5],[-1,3]];
  seeds.forEach(([dx,dy],i)=>{
    const p=0.5+0.5*Math.sin(now/500+i);
    ctx.fillStyle='hsla(35,60%,'+(55+p*15)+'%,.8)';
    ctx.beginPath(); ctx.arc(dx,dy-2,0.5,0,6.283); ctx.fill();
  });
}
// 3. Ахондриты — дифференцированное тело, хондр НЕТ, гладкая переработанная порода (честный контраст с #2)
function drawAchondrite(ctx,now){
  const p=0.5+0.5*Math.sin(now/1100);
  const g=ctx.createRadialGradient(-1,-3,0,0,-2,6.5);
  g.addColorStop(0,'hsla(20,30%,'+(42+p*8)+'%,1)'); g.addColorStop(1,'hsla(20,25%,25%,1)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-2,6,0,6.283); ctx.fill();
}
// 4. Видманштеттенов узор — переплетение камасита/тэнита, физически невоспроизводимо на Земле
function drawWidmanstatten(ctx,now){
  const sweep=((now/1400)%16)-8;
  ctx.save(); ctx.rotate(0.4);
  for(let i=-6;i<6;i+=1.1){
    const glint=Math.max(0,1-Math.abs(i-sweep)/2.5);
    ctx.strokeStyle='hsla(45,15%,'+(60+((i*13)%20)+glint*25)+'%,'+(0.6+glint*0.35)+')'; ctx.lineWidth=0.4;
    ctx.beginPath(); ctx.moveTo(i,-9); ctx.lineTo(i+3,9); ctx.stroke();
  }
  for(let i=-6;i<6;i+=1.1){
    const glint=Math.max(0,1-Math.abs(i-sweep)/2.5);
    ctx.strokeStyle='hsla(45,10%,'+(35+((i*17)%20)+glint*25)+'%,'+(0.5+glint*0.3)+')'; ctx.lineWidth=0.4;
    ctx.beginPath(); ctx.moveTo(i,9); ctx.lineTo(i+3,-9); ctx.stroke();
  }
  ctx.restore();
}
// 5. Паллaситы — оливин (зелёно-золотой) в металлической матрице, "витражный" эффект
function drawPallasite(ctx,now){
  ctx.fillStyle='hsla(220,10%,45%,1)'; ctx.beginPath(); ctx.arc(0,-2,6,0,6.283); ctx.fill();
  const seeds=[[-2,-4,3],[1.5,-2,2.2],[-3,1,2.6],[2.5,2,2],[0,3.5,1.8]];
  seeds.forEach(([dx,dy,rr],i)=>{
    const p=0.5+0.5*Math.sin(now/600+i);
    ctx.fillStyle='hsla(75,60%,'+(45+p*15)+'%,.7)';
    ctx.beginPath(); ctx.arc(dx,dy-2,rr*0.5,0,6.283); ctx.fill();
  });
}
// 6. Шкала редкости — камень 94% / железо 4.6% / железокаменный 1.1%
function drawRarityLadder(ctx,now){
  const p1=0.5+0.5*Math.sin(now/900), p2=0.5+0.5*Math.sin(now/900+2), p3=0.5+0.5*Math.sin(now/900+4);
  ctx.fillStyle='hsla(30,30%,'+(45+p1*8)+'%,.9)'; ctx.beginPath(); ctx.arc(-3.5,-2,3.2,0,6.283); ctx.fill();
  ctx.fillStyle='hsla(220,10%,'+(60+p2*10)+'%,.9)'; ctx.beginPath(); ctx.arc(2.5,-4,1.1,0,6.283); ctx.fill();
  ctx.fillStyle='hsla(75,55%,'+(50+p3*12)+'%,.9)'; ctx.beginPath(); ctx.arc(3.5,0,0.6,0,6.283); ctx.fill();
}
// 7. Челябинск 2013 — взрыв в воздухе, ~500 килотонн, никто не погиб
function drawChelyabinsk(ctx,now){
  const p=(now%1600)/1600;
  const r=1+p*7;
  ctx.strokeStyle='hsla(40,90%,75%,'+(0.5-p*0.45)+')'; ctx.lineWidth=0.5;
  ctx.beginPath(); ctx.arc(0,-2,r,0,6.283); ctx.stroke();
  ctx.fillStyle='hsla(40,90%,80%,'+(1-p)+')'; ctx.beginPath(); ctx.arc(0,-2,0.6,0,6.283); ctx.fill();
}
// 8. Чикшулуб — тело в 500-750 раз крупнее Челябинского, вымирание динозавров
function drawChicxulub(ctx,now){
  const p=(now%2200)/2200;
  ctx.strokeStyle='hsla(0,70%,60%,'+(0.5-p*0.35)+')'; ctx.lineWidth=0.4;
  ctx.beginPath(); ctx.arc(0,-2,7+p*1.5,0,6.283); ctx.stroke();
  ctx.fillStyle='hsla(0,50%,45%,.6)'; ctx.beginPath(); ctx.arc(0,-2,7,0,6.283); ctx.fill();
  const s=0.5+0.5*Math.sin(now/400);
  ctx.fillStyle='hsla(40,90%,80%,'+(0.5+s*0.5)+')'; ctx.beginPath(); ctx.arc(-5,-6,0.15,0,6.283); ctx.fill();
}
// 9. Цвет входа в атмосферу — натрий жёлтый, магний сине-зелёный (с честной оговоркой — не точный код состава)
function drawEntryGlow(ctx,now){
  const p=(now%1000)/1000;
  ctx.strokeStyle='hsla(55,95%,65%,.8)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(-1,7); ctx.lineTo(1,-8); ctx.stroke();
  ctx.strokeStyle='hsla(160,80%,60%,.5)'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(-1.6,6); ctx.lineTo(0.4,-7); ctx.stroke();
}
// 10. Названия потоков по созвездию радианта — Персеиды/Леониды/Геминиды (сами метеоры сгорают рядом с наблюдателем)
function drawShowerNaming(ctx,now){
  const s=0.5+0.5*Math.sin(now/500);
  ctx.fillStyle='hsla(45,80%,'+(75+s*10)+'%,.9)'; ctx.beginPath(); ctx.arc(0,-8,0.5,0,6.283); ctx.fill();
  for(let i=0;i<5;i++){
    const off=(i-2)*1.6;
    ctx.strokeStyle='hsla(45,70%,75%,.35)'; ctx.lineWidth=0.35;
    ctx.beginPath(); ctx.moveTo(off*3,6); ctx.lineTo(0,-8); ctx.stroke();
    const t=((now/700)+i*0.35)%1;
    ctx.fillStyle='hsla(45,90%,85%,'+(1-t)+')';
    ctx.beginPath(); ctx.arc(off*3*(1-t),6-t*14,0.2,0,6.283); ctx.fill();
  }
}

mountCards([
  {id:'m1', name:'Геометрия радианта', body:'#141210', drawFn:drawRadiantGeometry, zoom:6, fact:'Метеоры летят параллельно — «сходятся» только зрительно, как рельсы вдали'},
  {id:'m2', name:'Хондриты (94%)', body:'#181410', drawFn:drawChondrite, zoom:6.5, fact:'Хондры возрастом ≈4,565 млрд лет — древнейшее вещество Солнечной системы'},
  {id:'m3', name:'Ахондриты', body:'#161008', drawFn:drawAchondrite, zoom:6.5, fact:'Без хондр — переработаны в разогретом дифференцированном теле'},
  {id:'m4', name:'Узор Видманштеттена', body:'#14120c', drawFn:drawWidmanstatten, zoom:6.5, fact:'Остывал 1-100°C за МИЛЛИОН лет — невоспроизводимо на Земле'},
  {id:'m5', name:'Паллaситы', body:'#0e1220', drawFn:drawPallasite, zoom:6.5, fact:'Оливин (тот же минерал, что перидот) в металле — «витражный» эффект'},
  {id:'m6', name:'Шкала редкости', body:'#12100c', drawFn:drawRarityLadder, zoom:6, fact:'Камень 94% / железо 4,6% / железокаменный 1,1% — реальные проценты падений'},
  {id:'m7', name:'Челябинск 2013', body:'#181206', drawFn:drawChelyabinsk, zoom:6, fact:'≈500 килотонн, взрыв в воздухе — никто не погиб от самого тела'},
  {id:'m8', name:'Чикшулуб', body:'#160c0a', drawFn:drawChicxulub, zoom:5.5, fact:'В 500-750 раз крупнее Челябинского — вымирание 66 млн лет назад'},
  {id:'m9', name:'Цвет входа', body:'#0e1210', drawFn:drawEntryGlow, zoom:6, fact:'Натрий=жёлтый, магний=сине-зелёный — но точно состав по цвету не определить'},
  {id:'m10', name:'Персеиды/Леониды/Геминиды', body:'#141008', drawFn:drawShowerNaming, zoom:6, fact:'Названы по созвездию радианта — сами метеоры горят прямо над головой'},
]);
</script>
