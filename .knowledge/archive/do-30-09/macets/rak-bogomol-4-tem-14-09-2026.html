<title>Макет: рак-богомол — 4 темы</title>
<style>
:root{ --bg:#0b0e1a; --panel:#12172a; --panel-edge:#232c4a; --text:#e8ecf7; --text-dim:#8b93b3; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px}
h1{font-size:18px;margin:0 0 4px}
p.sub{color:var(--text-dim);font-size:12px;max-width:900px;margin:0 0 20px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:1100px}
.card{background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:12px;text-align:center}
.card canvas{width:100%;aspect-ratio:1;border-radius:10px;background:linear-gradient(180deg,#0a0e29 0%,#0e1a2a 55%,#0a1420 100%)}
.name{font-size:12px;font-weight:700;margin-top:8px}
.fact{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.4}
</style>
<h1>Рак-богомол — 4 темы (честный шорт-лист файла, 5-й пункт — не визуальная механика)</h1>
<p class="sub">Каждая карточка — реальный факт из .knowledge/MANTIS-SHRIMP-VISION.md. На корпусе, живая анимация.</p>
<div class="grid" id="grid"></div>
<script>
const BODY_PTS=[[0,-22],[-16,14],[0,6],[16,14]];
function clipBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.clip(); }
function fillBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.fill(); }
function edgeStroke(ctx){
  ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1.1;
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.lineTo(-16,14); ctx.moveTo(0,-22); ctx.lineTo(16,14);
  ctx.moveTo(-16,14); ctx.lineTo(0,6); ctx.moveTo(0,6); ctx.lineTo(16,14);
  ctx.stroke();
}
function mountCards(items){
  const grid=document.getElementById('grid');
  items.forEach(({id,name,body,drawFn,zoom,fact})=>{
    const card=document.createElement('div'); card.className='card';
    const cv=document.createElement('canvas'); cv.id=id;
    const nm=document.createElement('div'); nm.className='name'; nm.textContent=name;
    const ft=document.createElement('div'); ft.className='fact'; ft.textContent=fact;
    card.appendChild(cv); card.appendChild(nm); card.appendChild(ft);
    grid.appendChild(card);
    loopFlash(cv,body,drawFn,zoom);
  });
}
function loopFlash(cv,bodyColor,drawFn,zoom){
  const ctx=cv.getContext('2d');
  function frame(now){
    const w=cv.clientWidth||160, h=cv.clientHeight||160;
    const dpr=Math.min(devicePixelRatio||1,2);
    if(cv._lw!==w||cv._lh!==h||cv._ld!==dpr){ cv.width=w*dpr; cv.height=h*dpr; cv._lw=w; cv._lh=h; cv._ld=dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    ctx.save(); ctx.translate(w/2,h/2); ctx.scale(zoom,zoom);
    ctx.save(); clipBody(ctx);
    const g=ctx.createLinearGradient(0,-22,0,16);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.45,bodyColor); g.addColorStop(1,'#0e1018');
    ctx.fillStyle=g; fillBody(ctx);
    ctx.restore();
    ctx.save(); clipBody(ctx); ctx.translate(0,-4);
    drawFn(ctx,now);
    ctx.restore();
    edgeStroke(ctx);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
// 1. Больше рецепторов ≠ лучше различает — 12 узких "штрихкод"-каналов узнают цвет мгновенно, но не тонко
function drawBarcodeEye(ctx,now){
  const n=12, w=1.0, x0=-n*w/2;
  const hues=[];
  for(let i=0;i<n;i++) hues.push(260+i*(360/n*1.3));
  for(let i=0;i<n;i++){
    const x=x0+i*w;
    const flick=0.5+0.5*Math.sin(now/220+i*2.1);
    ctx.fillStyle='hsla('+(hues[i]%360)+',75%,'+(45+flick*20)+'%,.9)';
    ctx.fillRect(x,-9,w-0.15,18);
  }
  const p=(now%1600)/1600;
  const scanX=x0+p*n*w;
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=0.4;
  ctx.beginPath(); ctx.moveTo(scanX,-9); ctx.lineTo(scanX,9); ctx.stroke();
}
// 2. Циркулярная поляризация — приватный, закрученный по спирали свет, который видит только свой
function drawCircularPol(ctx,now){
  const p=(now%2600)/2600;
  const turns=3;
  ctx.strokeStyle='hsla(280,80%,70%,.7)'; ctx.lineWidth=0.6;
  ctx.beginPath();
  for(let t=0;t<=1;t+=0.02){
    const ang=t*turns*6.283 + p*6.283;
    const rr=1+t*7;
    const x=Math.cos(ang)*rr, y=-8+t*16;
    if(t===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.fillStyle='hsla(280,90%,85%,.6)';
  ctx.beginPath(); ctx.arc(0,-8,1.2,0,6.283); ctx.fill();
}
// 3. Трёхмерное зрение одним глазом — 3 независимые зоны (верх/сред/низ), каждая сама наводится на глубину
function drawTrinocularEye(ctx,now){
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=0.4;
  ctx.beginPath(); ctx.ellipse(0,2,8,10,0,0,6.283); ctx.stroke();
  const zones=[{cy:-6,period:1800},{cy:2,period:1300},{cy:9,period:2200}];
  zones.forEach((z,i)=>{
    const ph=(now%z.period)/z.period;
    const focus=0.5+0.5*Math.cos(ph*6.283);
    ctx.strokeStyle='hsla('+(190+i*40)+',75%,65%,'+(0.4+0.4*focus)+')';
    ctx.lineWidth=0.4;
    ctx.beginPath(); ctx.arc(0,z.cy,1.2+focus*1.2,0,6.283); ctx.stroke();
    ctx.fillStyle='hsla('+(190+i*40)+',75%,65%,'+(0.15+0.25*focus)+')';
    ctx.beginPath(); ctx.arc(0,z.cy,0.6,0,6.283); ctx.fill();
  });
}
// 4. Удар смашера — двойной импульс: механический удар клешнёй + схлопывание кавитационного пузыря
function drawSmasherPunch(ctx,now){
  const p=(now%1400)/1400;
  if(p<0.35){
    const t=p/0.35;
    ctx.strokeStyle='hsla(30,80%,60%,'+(1-t*0.3)+')'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(-4,-14+t*10); ctx.lineTo(0,2+t*4); ctx.stroke();
  } else if(p<0.55){
    const t=(p-0.35)/0.2;
    ctx.strokeStyle='hsla(40,90%,70%,'+(1-t)+')'; ctx.lineWidth=0.6;
    ctx.beginPath(); ctx.arc(0,4,t*6,0,6.283); ctx.stroke();
  } else if(p<0.72){
    const t=(p-0.55)/0.17;
    ctx.fillStyle='hsla(50,100%,90%,'+(1-t)*0.9+')';
    ctx.beginPath(); ctx.arc(0,4,2.5*(1-t*0.4),0,6.283); ctx.fill();
    ctx.strokeStyle='hsla(45,100%,80%,'+(1-t)+')'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.arc(0,4,3+t*7,0,6.283); ctx.stroke();
  } else {
    const rest=0.5+0.5*Math.sin(now/500);
    ctx.strokeStyle='hsla(30,50%,50%,'+(0.3+rest*0.15)+')'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(-4,-14); ctx.lineTo(0,2); ctx.stroke();
  }
}

mountCards([
  {id:'m1', name:'Больше рецепторов ≠ лучше', body:'#1a1024', drawFn:drawBarcodeEye, zoom:6.5, fact:'12-16 типов рецепторов, но различение оттенков в ~10 раз хуже человека (Thoen, 2014)'},
  {id:'m2', name:'Циркулярная поляризация', body:'#140f1e', drawFn:drawCircularPol, zoom:6.5, fact:'Единственное животное, видящее круговую поляризацию — приватный сигнал для своих (2008)'},
  {id:'m3', name:'Трёхмерное зрение одним глазом', body:'#0e1620', drawFn:drawTrinocularEye, zoom:6.5, fact:'3 независимые зоны одного глаза сами оценивают глубину — даже с одним глазом'},
  {id:'m4', name:'Удар смашера', body:'#1a1408', drawFn:drawSmasherPunch, zoom:6.5, fact:'До 1501Н удара плюс кавитационный пузырь до 280% силы, вспышка ~5000-50000К'},
]);
</script>
