<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Оффер гироскопа на итогах (макет, не игра)</title>
<style>
:root{
  --bg-0:#0b1626; --bg-1:#0f1f3d; --bg-2:#162638;
  --gold:#c9a45c; --gold-hi:#f0c040; --ink:#f4f6fb;
  --line:rgba(255,255,255,.08); --line-gold:rgba(201,164,92,.45);
  --font-ui:'Exo 2',-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-disp:'Exo 2',-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-btn:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg-0);color:var(--ink);font-family:var(--font-ui);overflow:hidden;}
body{-webkit-tap-highlight-color:transparent;user-select:none;}

/* --- debug: показ "до" (без офера, 2+я игра) / "после" (первая игра) --- */
#devSwitch{position:fixed;top:0;left:0;right:0;z-index:999;display:flex;gap:6px;justify-content:center;
  padding:6px;background:#000;border-bottom:2px solid #444;font-size:11px;}
#devSwitch button{background:#222;color:#aaa;border:1px solid #555;border-radius:6px;padding:5px 10px;font-family:var(--font-ui);cursor:pointer;}
#devSwitch button.on{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700;}

.stage{position:absolute;top:30px;left:0;right:0;bottom:0;overflow:hidden;background:linear-gradient(180deg,#132038,#0b1626 60%);}
#stars{position:absolute;inset:0;pointer-events:none;}
.star{position:absolute;border-radius:50%;background:#fff;}

#over{position:absolute;left:0;right:0;top:60px;bottom:0;display:flex;flex-direction:column;align-items:center;padding:0 22px;overflow-y:auto;}
#finalScoreLabel{font-family:var(--font-disp);font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--gold-hi);margin-top:6px;}
#finalScore{font-family:var(--font-disp);font-weight:700;font-size:64px;line-height:1;color:var(--gold-hi);margin:4px 0 22px;}

.btn { pointer-events:auto; cursor:pointer; margin:6px 0; width:100%; max-width:320px;
  display:inline-flex; align-items:center; justify-content:center; gap:.55em;
  border-radius:var(--r-btn); padding:14px 26px;
  font-family:var(--font-ui); font-size:15px; font-weight:600; letter-spacing:.04em;
  color:#dce9ff; background:rgba(10,18,36,.55); border:1px solid rgba(160,210,255,.18);
  transition:transform .12s ease, border-color .2s, background .2s, color .2s, opacity .3s; }
.btn:active { transform:scale(.97); }
.btn.pri { background:rgba(24,40,72,.7); border-color:rgba(190,225,255,.45); color:#f2f7ff;
  box-shadow:0 0 16px rgba(120,170,255,.12), inset 0 0 12px rgba(120,170,255,.05); }
.btn.ghost { background:rgba(22,36,64,.68); border-color:rgba(160,210,255,.34);
  color:#cddcf7; font-weight:500; box-shadow:0 0 12px rgba(120,170,255,.10); }
.btn.small { padding:10px 18px; font-size:13px; }

/* ---- новая кнопка-оффер: тот же .btn, но золотой акцент — как единственный НОВЫЙ элемент
     на экране, не сливается с обычными серыми ghost-кнопками, но и не кричит как reward ---- */
#gyroOfferWrap{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;
  margin:2px 0 10px;transition:opacity .35s ease, max-height .35s ease;overflow:hidden;}
#gyroOfferWrap.gone{opacity:0;max-height:0;margin:0;pointer-events:none;}
#gyroHint{font-size:12px;color:rgba(244,246,251,.6);margin-bottom:7px;text-align:center;line-height:1.4;}
#gyroBtn{background:rgba(201,164,92,.14);border-color:var(--line-gold);color:var(--gold-hi);}
#gyroBtn:active{border-color:var(--gold-hi);}
#gyroWaitLine{font-size:13px;color:rgba(244,246,251,.75);text-align:center;padding:14px 0;display:none;}
#gyroWaitLine.show{display:block;}
#gyroOkLine{font-size:13px;color:var(--gold-hi);text-align:center;padding:14px 0;display:none;}
#gyroOkLine.show{display:block;}

.rest{margin-top:6px;}
</style>
</head>
<body>

<div id="devSwitch">
  <button data-set="first" class="on">1-й полёт (оффер есть)</button>
  <button data-set="second">2-й+ полёт (офера нет)</button>
</div>

<div class="stage"><div id="stars"></div>
  <div id="over">
    <div id="finalScoreLabel">СЧЁТ</div>
    <div id="finalScore">1 240</div>

    <button class="btn pri" id="retryBtn">Ещё раз</button>

    <!-- ===== новый блок: появляется один раз в жизни аккаунта, ровно под "Ещё раз" ===== -->
    <div id="gyroOfferWrap">
      <div id="gyroHint">Ты попробовал пальцем — можно попробовать гироскоп</div>
      <button class="btn" id="gyroBtn">Разблокировать гироскоп</button>
      <div id="gyroWaitLine">Держи телефон ровно…</div>
      <div id="gyroOkLine">Готово — теперь можно рулить наклоном ✓</div>
    </div>
    <!-- ===== конец нового блока ===== -->

    <div class="rest">
      <button class="btn ghost small">Карточка</button>
      <button class="btn ghost small">Подробности полёта</button>
      <button class="btn ghost small">Меню</button>
    </div>
  </div>
</div>

<script>
function buildStars(){
  const layer = document.getElementById('stars'); layer.innerHTML='';
  for(let i=0;i<40;i++){
    const s = document.createElement('div'); s.className='star';
    const sz = 1+Math.random()*2;
    s.style.width=sz+'px'; s.style.height=sz+'px';
    s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*70)+'%';
    s.style.opacity = .2+Math.random()*.5;
    layer.appendChild(s);
  }
}
buildStars();

document.getElementById('gyroBtn').addEventListener('click', ()=>{
  const btn = document.getElementById('gyroBtn');
  const hint = document.getElementById('gyroHint');
  const wait = document.getElementById('gyroWaitLine');
  const ok = document.getElementById('gyroOkLine');
  btn.style.display='none'; hint.style.display='none';
  wait.classList.add('show');
  setTimeout(()=>{
    wait.classList.remove('show');
    ok.classList.add('show');
    setTimeout(()=>{
      document.getElementById('gyroOfferWrap').classList.add('gone');
    }, 1400);
  }, 1600);
});

document.querySelectorAll('#devSwitch button[data-set]').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('#devSwitch button[data-set]').forEach(x=>x.classList.toggle('on', x===b));
    const wrap = document.getElementById('gyroOfferWrap');
    if(b.dataset.set==='second'){ wrap.style.display='none'; }
    else { wrap.style.display='flex';
      wrap.classList.remove('gone');
      document.getElementById('gyroBtn').style.display='';
      document.getElementById('gyroHint').style.display='';
      document.getElementById('gyroWaitLine').classList.remove('show');
      document.getElementById('gyroOkLine').classList.remove('show');
    }
  });
});
</script>
</body>
</html>
