<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Карта — как в референсе (макет, не игра)</title>
<style>
:root{
  --bg-0:#0b1626; --bg-1:#0f1f3d;
  --gold:#c9a45c; --gold-hi:#f0c040; --ink:#f4f6fb;
  --line-gold:rgba(201,164,92,.45);
  --danger:#e0533d; --muted:#7d8aa8; --cream:#fce1b6;
  --font-ui:'Exo 2',-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg-0);color:var(--ink);font-family:var(--font-ui);overflow:hidden}
body{-webkit-tap-highlight-color:transparent;user-select:none}

.stage{position:absolute;inset:0;overflow:hidden}
#sky{position:absolute;inset:0;background:linear-gradient(180deg,hsl(214 62% 24%),hsl(230 55% 11%))}
#stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff}

/* ===== в точности референс (konstruktor-3-shaga-12-09-2026.html), только реальные данные внутри ===== */
#stepHead{position:absolute;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
#stepTitle{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-hi);
  text-shadow:0 0 14px rgba(240,192,64,.35);font-weight:600}
#dots{display:flex;gap:7px;justify-content:center;margin-top:8px}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22)}
.dot.cur{background:var(--gold-hi);width:20px;border-radius:4px;box-shadow:0 0 10px rgba(240,192,64,.6)}

#track{position:absolute;left:20px;right:20px;top:150px;height:7px;border-radius:5px;
  background:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.55));
  box-shadow:0 0 10px rgba(255,255,255,.25);cursor:pointer}
.obst{position:absolute;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);
  border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 8px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;top:0}
.obst.sel{border-color:var(--gold-hi);box-shadow:0 0 14px rgba(240,192,64,.65);transform:translate(-50%,-50%) scale(1.12)}
.obst svg{width:14px;height:14px}

#lenRow{position:absolute;left:16px;right:16px;top:172px;z-index:5;display:flex;align-items:center;gap:10px}
#lenRow label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,246,251,.6);flex:none}
#lenRow input[type=range]{flex:1;accent-color:var(--gold-hi)}
#lenRow .lenVal{font-size:11px;color:var(--gold-hi);flex:none;font-weight:600}

#topTools{position:absolute;right:14px;top:70px;z-index:5;display:flex;gap:8px}
#topTools button{background:rgba(11,22,38,.55);border:1px solid rgba(255,255,255,.15);color:rgba(244,246,251,.75);
  font-family:var(--font-ui);font-size:10px;letter-spacing:.04em;border-radius:14px;padding:6px 10px;cursor:pointer}
#resetBtn.confirming{background:rgba(224,83,61,.85);border-color:var(--danger);color:#fff}

#palette{position:absolute;left:0;right:0;bottom:74px;z-index:5;
  display:flex;gap:12px;overflow-x:auto;padding:10px 16px 12px;
  background:linear-gradient(0deg,rgba(6,10,20,.6),transparent);scrollbar-width:none}
#palette::-webkit-scrollbar{display:none}
.palCell{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.palIcon{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;transition:.15s;color:#fff}
.palIcon svg{width:55%;height:55%}
.palCell.armed .palIcon{border-color:var(--gold-hi);box-shadow:0 0 14px rgba(240,192,64,.5);transform:translateY(-3px)}
.palCell span{font-size:8.5px;letter-spacing:.03em;text-transform:uppercase;color:rgba(244,246,251,.65);white-space:nowrap}
.palCell.armed span{color:var(--gold-hi)}

/* --- пузырёк точки: прямое манипулирование прямо на объекте (RESEARCH-SINGLE-STEP-FLOW п.2) --- */
#pointBubble{position:absolute;z-index:10;background:rgba(10,18,32,.95);backdrop-filter:blur(6px);
  border:1px solid var(--line-gold);border-radius:12px;padding:8px 10px;width:198px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
#pointBubble.show{display:block}
.pbHead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.pbIcon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.pbIcon svg{width:10px;height:10px}
.pbName{font-size:11px;font-weight:600;flex:1}
.pbDel{color:var(--danger);font-size:14px;cursor:pointer;padding:2px 4px;line-height:1}
.pbNudgeRow{display:flex;align-items:center;gap:3px;margin-bottom:4px}
.pbNudge{flex:none;width:27px;height:24px;border-radius:7px;border:1px solid rgba(255,255,255,.16);
  background:#0f1f3d;color:var(--cream);font-family:inherit;font-size:9.5px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.pbAt{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--gold-hi)}
.pbHint{font-size:8.5px;color:var(--muted);text-align:center;line-height:1.3}
.pbSeg{display:flex;gap:4px;margin-top:4px}
.pbSeg button{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:var(--ink);
  font-family:inherit;font-size:9px;border-radius:6px;padding:4px 0;cursor:pointer}
.pbSeg button.sel{border-color:var(--gold-hi);color:var(--gold-hi);background:rgba(240,192,64,.12)}
.pbNote{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.16);border-radius:6px;
  color:var(--ink);font-family:inherit;font-size:10px;padding:5px;resize:none;margin-top:4px}

#dragValue{position:absolute;z-index:20;background:var(--gold-hi);color:#1c1200;font-weight:700;
  font-size:11px;padding:4px 9px;border-radius:10px;display:none;transform:translate(-50%,-140%);pointer-events:none}
#dragValue.show{display:block}

#confirmWrap{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:center;z-index:6}
#confirmBtn{font-family:var(--font-ui);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  background:linear-gradient(180deg,rgba(240,192,64,.95),rgba(201,164,92,.95));color:#1c1200;
  border:none;border-radius:30px;padding:14px 34px;box-shadow:0 6px 20px rgba(201,164,92,.35);cursor:pointer;
  display:flex;align-items:center;gap:8px}
#confirmBtn svg{width:16px;height:16px}
</style>
</head>
<body>
<div class="stage">
  <div id="sky"><div id="stars"></div></div>
  <div id="stepHead">
    <div id="stepTitle">КАРТА</div>
    <div id="dots"><span class="dot cur"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <div id="track"></div>
  <div id="obstLayer"></div>
  <div id="lenRow">
    <label>Длина</label><input type="range" id="lenSlider" min="1000" max="25000" step="250" value="1500">
    <span class="lenVal" id="lenVal">1500м</span>
  </div>
  <div id="topTools">
    <button id="pointsBtn">Точек: 0</button>
    <button id="resetBtn">Сбросить</button>
  </div>
  <div id="palette"></div>

  <div id="pointBubble">
    <div class="pbHead"><span class="pbIcon" id="pbIcon"></span><span class="pbName" id="pbName">Точка</span><span class="pbDel" id="pbDel">✕</span></div>
    <div class="pbNudgeRow">
      <button class="pbNudge" data-n="-10">−10</button>
      <button class="pbNudge" data-n="-1">−1</button>
      <div class="pbAt" id="pbAt">300м</div>
      <button class="pbNudge" data-n="1">+1</button>
      <button class="pbNudge" data-n="10">+10</button>
    </div>
    <div class="pbHint">±1/±10 — или тащи точку по ленте</div>
    <div class="pbSeg" id="pbSeg" style="display:none"><button data-d="l">Слева</button><button data-d="r" class="sel">Справа</button></div>
    <textarea class="pbNote" id="pbNote" rows="2" placeholder="заметка…" style="display:none"></textarea>
  </div>
  <div id="dragValue">300м</div>

  <div id="confirmWrap">
    <button id="confirmBtn"><span>Подтвердить карту</span>
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#1c1200" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<script>
const PT_KIND_LABEL={rock:'Астероид',debris:'Обломок',drift:'Дрейфер',mine:'Мина',sat:'Спутник',comet:'Комета',seeker:'Ловец',gate:'Ворота'};
const PT_KIND_COLOR={rock:'#d99a4e',debris:'#6fa3e0',drift:'#b073ea',mine:'#ff5f6d',sat:'#4f7fe6',comet:'#ff9a52',seeker:'#ffe14a',gate:'#22b8dd'};
const PT_ICON_SVG={
  pause:'<svg viewBox="0 0 24 24"><rect x="6.5" y="4" width="4" height="16" rx="1.5" fill="currentColor"/><rect x="13.5" y="4" width="4" height="16" rx="1.5" fill="currentColor"/></svg>',
  marker:'<svg viewBox="0 0 24 24"><path d="M3 21l1.2-5.6L15.6 3.9a1.6 1.6 0 0 1 2.3 0l2.2 2.2a1.6 1.6 0 0 1 0 2.3L8.6 19.8 3 21z" fill="currentColor"/></svg>',
  rock:'<svg viewBox="0 0 24 24"><polygon points="12,2.5 18,6.5 20.5,13 16,20 8,19.5 3.5,13.5 5.5,6" fill="currentColor"/></svg>',
  debris:'<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="2" fill="currentColor"/><rect x="3" y="11.2" width="18" height="1.6" fill="rgba(0,0,0,.3)"/></svg>',
  drift:'<svg viewBox="0 0 24 24"><polygon points="2,12 7,5.5 17,5 22,12 16,19 6,18.5" fill="currentColor"/></svg>',
  mine:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="12" x2="22" y2="12"/><line x1="16.2" y1="16.2" x2="19.1" y2="19.1"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="7.8" y1="16.2" x2="4.9" y2="19.1"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="7.8" y1="7.8" x2="4.9" y2="4.9"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="16.2" y1="7.8" x2="19.1" y2="4.9"/></g></svg>',
  sat:'<svg viewBox="0 0 24 24"><rect x="10" y="9.5" width="4" height="5" rx="1" fill="currentColor"/><rect x="1.5" y="8.5" width="6" height="7" rx="1.3" fill="currentColor" opacity=".85"/><rect x="16.5" y="8.5" width="6" height="7" rx="1.3" fill="currentColor" opacity=".85"/><line x1="7.5" y1="12" x2="10" y2="12" stroke="currentColor" stroke-width="1.6"/><line x1="14" y1="12" x2="16.5" y2="12" stroke="currentColor" stroke-width="1.6"/></svg>',
  comet:'<svg viewBox="0 0 24 24"><circle cx="16" cy="8" r="3.4" fill="currentColor"/><path d="M14 10.2C10 12 5.5 15 2 21c5.5-2.6 9.5-5.3 12.6-9.4z" fill="currentColor" opacity=".55"/></svg>',
  seeker:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="12" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="2.1"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>',
  gate:'<svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="5" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="19" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
};
const FORGE_KINDS=['rock','debris','drift','mine','sat','comet','seeker','gate'];
const TRAY=[{t:'pause',cap:'Передышка'},{t:'marker',cap:'Заметка'}].concat(FORGE_KINDS.map(k=>({t:'kind',k,cap:PT_KIND_LABEL[k]})));
function swColor(d){ return d.t==='kind'?PT_KIND_COLOR[d.k]:'#8fa3c8'; }
function swIcon(d){ return d.t==='kind'?PT_ICON_SVG[d.k]:PT_ICON_SVG[d.t]; }
function pinName(p){ return p.type==='pause'?'Передышка':p.type==='marker'?'Заметка':PT_KIND_LABEL[p.kind]; }

function buildStars(){
  const layer=document.getElementById('stars');
  for(let i=0;i<40;i++){
    const s=document.createElement('div'); s.className='star';
    const sz=1+Math.random()*2;
    s.style.width=sz+'px'; s.style.height=sz+'px';
    s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*80)+'%';
    s.style.opacity=.25+Math.random()*.6;
    layer.appendChild(s);
  }
}
buildStars();

const pins=[
  {at:320, pct:.21, type:'pause'},
  {at:640, pct:.43, type:'kind', kind:'rock'},
  {at:980, pct:.65, type:'kind', kind:'comet', dir:'r'},
  {at:1210, pct:.81, type:'marker', note:'тут резкий поворот'},
];
let selIdx=-1, armedType=null;

function renderPalette(){
  const p=document.getElementById('palette'); p.innerHTML='';
  TRAY.forEach(d=>{
    const cell=document.createElement('div'); cell.className='palCell';
    cell.innerHTML=`<div class="palIcon" style="background:${swColor(d)}">${swIcon(d)}</div><span>${d.cap}</span>`;
    cell.onclick=()=>{
      const same = armedType && armedType.t===d.t && armedType.k===d.k;
      armedType = same ? null : d;
      document.querySelectorAll('.palCell').forEach(x=>x.classList.remove('armed'));
      if(!same) cell.classList.add('armed');
    };
    p.appendChild(cell);
  });
}
renderPalette();

function renderObstacles(){
  const layer=document.getElementById('obstLayer'); layer.innerHTML='';
  const trackTop=document.getElementById('track').getBoundingClientRect().top-document.querySelector('.stage').getBoundingClientRect().top+3;
  pins.forEach((p,i)=>{
    const d=p.type==='kind'?{t:'kind',k:p.kind}:{t:p.type};
    const el=document.createElement('div'); el.className='obst'+(i===selIdx?' sel':'');
    el.style.left=`calc(20px + (100% - 40px) * ${p.pct})`;
    el.style.top=trackTop+'px';
    el.style.background=swColor(d);
    el.innerHTML=swIcon(d);
    el.onclick=(e)=>{ e.stopPropagation(); selIdx=i; renderObstacles(); openBubble(document.querySelectorAll('.obst')[i]); };
    el.addEventListener('pointerdown',(e)=>startDrag(e,i));
    layer.appendChild(el);
  });
  document.getElementById('pointsBtn').textContent='Точек: '+pins.length;
}
renderObstacles();

document.getElementById('track').addEventListener('click',(e)=>{
  const rect=e.currentTarget.getBoundingClientRect();
  const pct=Math.max(.02,Math.min(.98,(e.clientX-rect.left)/rect.width));
  if(armedType){
    const p={at:Math.round(pct*1500), pct, type:armedType.t, kind:armedType.k};
    pins.push(p); selIdx=pins.length-1;
    document.querySelectorAll('.palCell').forEach(x=>x.classList.remove('armed')); armedType=null;
    renderObstacles(); openBubble(document.querySelectorAll('.obst')[selIdx]);
  } else {
    selIdx=-1; closeBubble(); renderObstacles();
  }
});

function openBubble(el){
  const p=pins[selIdx]; if(!p||!el) return;
  const bubble=document.getElementById('pointBubble');
  bubble.classList.add('show');
  const stageR=document.querySelector('.stage').getBoundingClientRect();
  const elR=el.getBoundingClientRect();
  const cx=elR.left+elR.width/2-stageR.left;
  let left=cx-99; left=Math.max(4,Math.min(stageR.width-202,left));
  bubble.style.left=left+'px';
  bubble.style.top=(elR.bottom-stageR.top+10)+'px';
  const d=p.type==='kind'?{t:'kind',k:p.kind}:{t:p.type};
  document.getElementById('pbIcon').style.background=swColor(d);
  document.getElementById('pbIcon').innerHTML=swIcon(d);
  document.getElementById('pbName').textContent=pinName(p);
  document.getElementById('pbAt').textContent=p.at+'м';
  const seg=document.getElementById('pbSeg');
  const showDir=p.type==='kind'&&(p.kind==='comet'||p.kind==='drift');
  seg.style.display=showDir?'flex':'none';
  const note=document.getElementById('pbNote');
  note.style.display=p.type==='marker'?'block':'none';
  if(p.type==='marker') note.value=p.note||'';
}
function closeBubble(){ document.getElementById('pointBubble').classList.remove('show'); }
document.getElementById('pbDel').onclick=()=>{
  if(selIdx<0) return; pins.splice(selIdx,1); selIdx=-1; closeBubble(); renderObstacles();
};
document.querySelectorAll('.pbNudge').forEach(b=>{
  b.onclick=(e)=>{
    e.stopPropagation(); if(selIdx<0) return;
    const p=pins[selIdx];
    p.at=Math.max(0,Math.min(1500,p.at+(+b.dataset.n))); p.pct=p.at/1500;
    renderObstacles(); openBubble(document.querySelectorAll('.obst')[selIdx]);
  };
});

function startDrag(e, idx){
  e.stopPropagation();
  const track=document.getElementById('track');
  const trackR=track.getBoundingClientRect();
  const stageR=document.querySelector('.stage').getBoundingClientRect();
  const dv=document.getElementById('dragValue');
  selIdx=idx; closeBubble(); renderObstacles();
  dv.classList.add('show');
  const move=(ev)=>{
    const x=ev.clientX;
    const pct=Math.max(.02,Math.min(.98,(x-trackR.left)/trackR.width));
    pins[idx].pct=pct; pins[idx].at=Math.round(pct*1500);
    renderObstacles(); selIdx=idx;
    document.querySelectorAll('.obst')[idx].classList.add('sel');
    dv.textContent=pins[idx].at+'м';
    dv.style.left=(x-stageR.left)+'px';
    dv.style.top=(trackR.top-stageR.top)+'px';
  };
  const up=()=>{
    document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up);
    dv.classList.remove('show');
    openBubble(document.querySelectorAll('.obst')[idx]);
  };
  document.addEventListener('pointermove',move); document.addEventListener('pointerup',up);
}

document.getElementById('lenSlider').addEventListener('input',e=>{ document.getElementById('lenVal').textContent=e.target.value+'м'; });

let resetArmed=false, resetTimer=null;
document.getElementById('resetBtn').addEventListener('click',(e)=>{
  const btn=e.currentTarget;
  if(!resetArmed){
    resetArmed=true; btn.classList.add('confirming'); btn.textContent='Точно?';
    resetTimer=setTimeout(()=>{ resetArmed=false; btn.classList.remove('confirming'); btn.textContent='Сбросить'; },3000);
    return;
  }
  clearTimeout(resetTimer); resetArmed=false; btn.classList.remove('confirming'); btn.textContent='Сбросить';
  pins.length=0; selIdx=-1; closeBubble(); renderObstacles();
});

document.getElementById('confirmBtn').addEventListener('click',()=>{
  const t=document.createElement('div'); t.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(201,164,92,.95);color:#1c1200;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;z-index:999;';
  t.textContent='Карта подтверждена ✓'; document.body.appendChild(t); setTimeout(()=>t.remove(),1600);
});
</script>
</body>
</html>
