<title>Макет: биолюминесценция — 7 тем</title>
<style>
:root{ --bg:#0b0e1a; --panel:#12172a; --panel-edge:#232c4a; --text:#e8ecf7; --text-dim:#8b93b3; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px}
h1{font-size:18px;margin:0 0 4px}
p.sub{color:var(--text-dim);font-size:12px;max-width:900px;margin:0 0 20px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:1100px}
.card{background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:12px;text-align:center}
.card canvas{width:100%;aspect-ratio:1;border-radius:10px;background:linear-gradient(180deg,#0a0e29 0%,#0e1a2a 55%,#0a1420 100%)}
.name{font-size:12px;font-weight:700;margin-top:8px}
.fact{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.4}
</style>
<h1>Биолюминесценция — 7 тем (шорт-лист файла: 6 + динофлагелляты)</h1>
<p class="sub">Каждая карточка — реальный факт из .knowledge/BIOLUMINESCENCE.md. На корпусе, живая анимация.</p>
<div class="grid" id="grid"></div>
<script>
const BODY_PTS=[[0,-22],[-16,14],[0,6],[16,14]];
function clipBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.clip(); }
function fillBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.fill(); }
function edgeStroke(ctx){
  ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1.1;
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.lineTo(-16,14); ctx.moveTo(0,-22); ctx.lineTo(16,14);
  ctx.moveTo(-16,14); ctx.lineTo(0,6); ctx.moveTo(0,6); ctx.lineTo(16,14);
  ctx.stroke();
}
function mountCards(items){
  const grid=document.getElementById('grid');
  items.forEach(({id,name,body,drawFn,zoom,fact})=>{
    const card=document.createElement('div'); card.className='card';
    const cv=document.createElement('canvas'); cv.id=id;
    const nm=document.createElement('div'); nm.className='name'; nm.textContent=name;
    const ft=document.createElement('div'); ft.className='fact'; ft.textContent=fact;
    card.appendChild(cv); card.appendChild(nm); card.appendChild(ft);
    grid.appendChild(card);
    loopFlash(cv,body,drawFn,zoom);
  });
}
function loopFlash(cv,bodyColor,drawFn,zoom){
  const ctx=cv.getContext('2d');
  function frame(now){
    const w=cv.clientWidth||160, h=cv.clientHeight||160;
    const dpr=Math.min(devicePixelRatio||1,2);
    if(cv._lw!==w||cv._lh!==h||cv._ld!==dpr){ cv.width=w*dpr; cv.height=h*dpr; cv._lw=w; cv._lh=h; cv._ld=dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    ctx.save(); ctx.translate(w/2,h/2); ctx.scale(zoom,zoom);
    ctx.save(); clipBody(ctx);
    const g=ctx.createLinearGradient(0,-22,0,16);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.45,bodyColor); g.addColorStop(1,'#060a10');
    ctx.fillStyle=g; fillBody(ctx);
    ctx.restore();
    ctx.save(); clipBody(ctx); ctx.translate(0,-4);
    drawFn(ctx,now);
    ctx.restore();
    edgeStroke(ctx);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// 1. Люциферин-люцифераза x5 — 5 независимых химических путей, цикл цвета (конвергентная эволюция)
function drawLuciferinFamily(ctx,now){
  const hues=[55,140,190,275,320]; // жёлто-зелёный, зелёный, циан, фиолет, розовый — 5 разных "изобретений"
  const p=(now%5000)/5000;
  const idx=Math.floor(p*5)%5;
  const local=(p*5)%1;
  const pulse=Math.sin(local*Math.PI);
  const hue=hues[idx];
  const g=ctx.createRadialGradient(0,0,0,0,0,11);
  g.addColorStop(0,'hsla('+hue+',95%,75%,'+(0.3+pulse*0.6)+')');
  g.addColorStop(1,'hsla('+hue+',95%,60%,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,11,0,6.283); ctx.fill();
  ctx.fillStyle='hsla('+hue+',95%,85%,'+(0.5+pulse*0.5)+')'; ctx.beginPath(); ctx.arc(0,0,2+pulse*1.5,0,6.283); ctx.fill();
}
// 2. Photuris/Photinus femme fatale — два разных ритма мигания (настоящий сигнал vs имитация-ловушка)
function drawFemmeFatale(ctx,now){
  const p1=((now%1200)/1200); // Photinus: короткий, частый
  const on1 = (p1%0.35)<0.12;
  const p2=((now%2600)/2600); // Photuris: имитирует, но со сдвигом/паузой
  const on2 = (p2%0.9)<0.14 && p2>0.5;
  ctx.fillStyle='hsla(50,95%,75%,'+(on1?0.9:0.12)+')';
  ctx.beginPath(); ctx.arc(-6,-6,2.6,0,6.283); ctx.fill();
  ctx.fillStyle='hsla(10,90%,65%,'+(on2?0.9:0.12)+')';
  ctx.beginPath(); ctx.arc(6,4,2.6,0,6.283); ctx.fill();
}
// 3. Мигание светлячка — чистая периодическая формула, 550-570нм (жёлто-зелёный)
function drawFireflyBlink(ctx,now){
  const p=(now%1400)/1400;
  const on=p<0.18;
  const glow=on?1:0.08;
  const g=ctx.createRadialGradient(0,0,0,0,0,9);
  g.addColorStop(0,'hsla(65,95%,80%,'+(0.25+glow*0.6)+')');
  g.addColorStop(1,'hsla(65,95%,60%,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,9,0,6.283); ctx.fill();
  ctx.fillStyle='hsla(65,95%,88%,'+(0.4+glow*0.6)+')'; ctx.beginPath(); ctx.arc(0,0,2.2,0,6.283); ctx.fill();
}
// 4. GFP — флуоресценция (не биолюминесценция!), зелёное свечение под "накачкой", Нобель 2008
function drawGFP(ctx,now){
  const p=(now%2000)/2000;
  const pump=0.5+0.5*Math.sin(p*2*Math.PI);
  ctx.fillStyle='rgba(120,255,170,.12)'; ctx.beginPath(); ctx.arc(0,0,12,0,6.283); ctx.fill();
  for(let i=0;i<18;i++){
    const a=i/18*6.283, r=4+((i*37)%7);
    ctx.fillStyle='hsla(140,90%,'+(60+pump*20)+'%,'+(0.35+pump*0.5)+')';
    ctx.beginPath(); ctx.arc(Math.cos(a)*r,Math.sin(a)*r*0.7,0.9,0,6.283); ctx.fill();
  }
}
// 5. Esca удильщика — светящаяся приманка на "удочке", бактериальное свечение (зернистое)
function drawAnglerEsca(ctx,now){
  const p=(now%2400)/2400;
  const sway=Math.sin(p*2*Math.PI)*2;
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=0.6;
  ctx.beginPath(); ctx.moveTo(0,-14); ctx.quadraticCurveTo(sway,-4,sway*1.3,4); ctx.stroke();
  const flick=0.6+0.4*Math.sin(p*2*Math.PI*6);
  const g=ctx.createRadialGradient(sway*1.3,4,0,sway*1.3,4,4.5);
  g.addColorStop(0,'hsla(195,90%,80%,'+(0.5+flick*0.4)+')');
  g.addColorStop(1,'hsla(195,90%,60%,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sway*1.3,4,4.5,0,6.283); ctx.fill();
  for(let i=0;i<5;i++){ const a=(i/5)*6.283+p*3; ctx.fillStyle='hsla(195,90%,90%,.7)'; ctx.beginPath(); ctx.arc(sway*1.3+Math.cos(a)*1.2,4+Math.sin(a)*1.2,0.4,0,6.283); ctx.fill(); }
}
// 6. Foxfire — гриб Panellus stipticus, диффузное зеленоватое свечение (мицелий-вены)
function drawFoxfire(ctx,now){
  const p=(now%3600)/3600;
  const pulse=0.6+0.4*Math.sin(p*2*Math.PI);
  ctx.strokeStyle='hsla(150,70%,60%,'+(0.35*pulse)+')'; ctx.lineWidth=0.5;
  const rnd=(function(seed){ let s=seed; return ()=>{ s=(s*1103515245+12345)&0x7fffffff; return (s%1000)/1000; }; })(7);
  for(let i=0;i<10;i++){
    const x0=(rnd()-0.5)*20, y0=(rnd()-0.5)*24;
    ctx.beginPath(); ctx.moveTo(x0,y0);
    let x=x0,y=y0;
    for(let k=0;k<4;k++){ x+=(rnd()-0.5)*6; y+=(rnd()-0.5)*6; ctx.lineTo(x,y); }
    ctx.stroke();
  }
  ctx.fillStyle='hsla(150,80%,70%,'+(0.15*pulse)+')'; ctx.beginPath(); ctx.arc(0,0,13,0,6.283); ctx.fill();
}
// 7. Динофлагелляты — вспышка по сдвиговому возмущению (волна-триггер), Trail-кандидат
function drawDinoflagellate(ctx,now){
  const p=(now%1800)/1800;
  const wave=p<0.5?p*2:0;
  for(let i=0;i<24;i++){
    const t=i/24;
    const trigger = Math.abs(t-wave)<0.12 && wave>0;
    const x=-13+t*26, y=Math.sin(t*6+p*2)*2;
    ctx.fillStyle=trigger?'hsla(200,90%,85%,.9)':'hsla(200,60%,60%,.15)';
    ctx.beginPath(); ctx.arc(x,y,trigger?1.3:0.6,0,6.283); ctx.fill();
  }
}

mountCards([
  {id:'g1', name:'Люциферин-люцифераза × 5', body:'#1a1428', drawFn:drawLuciferinFamily, zoom:6.5, fact:'5 разных химических путей, изобретённых природой независимо'},
  {id:'g2', name:'Photuris/Photinus — обман', body:'#1c1408', drawFn:drawFemmeFatale, zoom:6.5, fact:'Ллойд, 1965 — хищник имитирует чужой брачный сигнал'},
  {id:'g3', name:'Мигание светлячка', body:'#141c10', drawFn:drawFireflyBlink, zoom:6.5, fact:'Люциферин+люцифераза+АТФ+O₂, 550-570нм'},
  {id:'g4', name:'GFP-флуоресценция', body:'#0e1c16', drawFn:drawGFP, zoom:6.5, fact:'Нобель 2008 — Симомура/Чалфи/Тсиен, не биолюминесценция'},
  {id:'g5', name:'Esca удильщика', body:'#0a1622', drawFn:drawAnglerEsca, zoom:6.5, fact:'Рыба «выращивает» светящихся бактерий, свет не свой'},
  {id:'g6', name:'Foxfire — гриб', body:'#101a14', drawFn:drawFoxfire, zoom:6.5, fact:'Panellus stipticus, пятая химическая линия люциферина'},
  {id:'g7', name:'Динофлагелляты', body:'#0c1420', drawFn:drawDinoflagellate, zoom:6.5, fact:'Вспышка от сдвигового возмущения потока — гипотеза тревоги'},
]);
</script>
