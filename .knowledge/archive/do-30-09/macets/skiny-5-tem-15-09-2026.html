<title>Макет: 5 новых скинов — свежие темы этой сессии</title>
<style>
:root{ --bg:#0b0e1a; --panel:#12172a; --panel-edge:#232c4a; --text:#e8ecf7; --text-dim:#8b93b3; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px}
h1{font-size:18px;margin:0 0 4px}
p.sub{color:var(--text-dim);font-size:12px;max-width:900px;margin:0 0 20px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:1100px}
.card{background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:12px;text-align:center}
.card canvas{width:100%;aspect-ratio:1;border-radius:10px;background:linear-gradient(180deg,#0a0e29 0%,#0e1a2a 55%,#0a1420 100%)}
.name{font-size:12px;font-weight:700;margin-top:8px}
.fact{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.4}
.src{font-size:9px;color:#5a6488;margin-top:3px}
</style>
<h1>5 новых скинов — темы этой сессии («Науки для тюнинга»)</h1>
<p class="sub">Каждая карточка — реальный факт из соответствующего .knowledge/tyuning/*.md файла. На корпусе корабля, живая анимация. Ничего из этого ещё не в игре — показ для выбора и «да».</p>
<div class="grid" id="grid"></div>
<script>
const BODY_PTS=[[0,-22],[-16,14],[0,6],[16,14]];
function clipBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.clip(); }
function fillBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.fill(); }
function edgeStroke(ctx){
  ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1.1;
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.lineTo(-16,14); ctx.moveTo(0,-22); ctx.lineTo(16,14);
  ctx.moveTo(-16,14); ctx.lineTo(0,6); ctx.moveTo(0,6); ctx.lineTo(16,14);
  ctx.stroke();
}
function mountCards(items){
  const grid=document.getElementById('grid');
  items.forEach(({id,name,body,drawFn,zoom,fact,src})=>{
    const card=document.createElement('div'); card.className='card';
    const cv=document.createElement('canvas'); cv.id=id;
    const nm=document.createElement('div'); nm.className='name'; nm.textContent=name;
    const ft=document.createElement('div'); ft.className='fact'; ft.textContent=fact;
    const sr=document.createElement('div'); sr.className='src'; sr.textContent=src;
    card.appendChild(cv); card.appendChild(nm); card.appendChild(ft); card.appendChild(sr);
    grid.appendChild(card);
    loopFlash(cv,body,drawFn,zoom);
  });
}
function loopFlash(cv,bodyColor,drawFn,zoom){
  const ctx=cv.getContext('2d');
  function frame(now){
    const w=cv.clientWidth||160, h=cv.clientHeight||160;
    const dpr=Math.min(devicePixelRatio||1,2);
    if(cv._lw!==w||cv._lh!==h||cv._ld!==dpr){ cv.width=w*dpr; cv.height=h*dpr; cv._lw=w; cv._lh=h; cv._ld=dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    ctx.save(); ctx.translate(w/2,h/2); ctx.scale(zoom,zoom);
    ctx.save(); clipBody(ctx);
    const g=ctx.createLinearGradient(0,-22,0,16);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.45,bodyColor); g.addColorStop(1,'#0e1018');
    ctx.fillStyle=g; fillBody(ctx);
    ctx.restore();
    ctx.save(); clipBody(ctx); ctx.translate(0,-4);
    drawFn(ctx,now);
    ctx.restore();
    edgeStroke(ctx);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// 1. Хроматическая поляризация — чёрный крест кальцита в сходящемся поляризованном свете
function drawCalciteCross(ctx,now){
  const rings=6;
  for(let i=rings;i>=1;i--){
    const r=i*1.5;
    const hue=(i*55+now/25)%360;
    ctx.strokeStyle=`hsla(${hue},75%,60%,.55)`; ctx.lineWidth=0.55;
    ctx.beginPath(); ctx.arc(0,0,r,0,6.283); ctx.stroke();
  }
  ctx.strokeStyle='rgba(5,5,8,.92)'; ctx.lineWidth=1.7;
  ctx.beginPath();
  ctx.moveTo(0,-9); ctx.lineTo(0,9);
  ctx.moveTo(-9,0); ctx.lineTo(9,0);
  ctx.stroke();
}
// 2. Фрактал Ляпунова — граница "Zircon Zity" (BBBBBBAAAAAA), жёлтый=порядок/синий=хаос
function drawZirconZity(ctx,now){
  const cell=1.1, cols=16, rows=16;
  for(let cx=0;cx<cols;cx++){
    for(let cy=0;cy<rows;cy++){
      const x=(cx-cols/2)*cell, y=(cy-rows/2)*cell;
      const n=Math.sin(x*1.3+now/900)+Math.cos(y*1.7-now/700)+Math.sin((x+y)*0.9+now/1200);
      const order=n>0.15;
      ctx.fillStyle= order? 'hsla(48,80%,55%,.75)' : 'hsla(210,80%,55%,.75)';
      if(Math.abs(n)<0.15) ctx.fillStyle='rgba(10,10,14,.9)';
      ctx.fillRect(x-cell/2,y-cell/2,cell*0.92,cell*0.92);
    }
  }
}
// 3. Little Red Dot — крошечная красная точка JWST + V-образный спектр
function drawLittleRedDot(ctx,now){
  const pulse=0.5+0.5*Math.sin(now/500);
  ctx.fillStyle='rgba(255,255,255,.06)';
  for(let i=0;i<10;i++){ const sx=((i*37)%17)-8.5, sy=((i*53)%17)-8.5; ctx.beginPath(); ctx.arc(sx,sy,0.18,0,6.283); ctx.fill(); }
  const g=ctx.createRadialGradient(0,0,0,0,0,3+pulse*0.6);
  g.addColorStop(0,'rgba(255,90,60,.95)'); g.addColorStop(.5,'rgba(200,40,30,.55)'); g.addColorStop(1,'rgba(200,40,30,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,3+pulse*0.6,0,6.283); ctx.fill();
  ctx.fillStyle='rgba(255,140,110,1)'; ctx.beginPath(); ctx.arc(0,0,0.7,0,6.283); ctx.fill();
  ctx.strokeStyle='rgba(120,180,255,.55)'; ctx.lineWidth=0.35;
  ctx.beginPath(); ctx.moveTo(-8,8); ctx.lineTo(-1,2); ctx.lineTo(0,9); ctx.lineTo(8,-6); ctx.stroke();
}
// 4. Номенклатура облаков Ховарда — cirrus/cumulus/stratus, три яруса
function drawHowardClouds(ctx,now){
  const t=now/1400;
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=0.35;
  for(let i=0;i<5;i++){ const y=-8+i*0.5, x=-8+((t*2+i*1.3)%17); ctx.beginPath(); ctx.moveTo(x-2,y); ctx.lineTo(x+2,y+0.3); ctx.stroke(); }
  ctx.fillStyle='rgba(230,235,250,.8)';
  for(let i=0;i<4;i++){ const cx=-5+i*3.3+Math.sin(t+i)*0.5, cy=0; ctx.beginPath(); ctx.arc(cx,cy,1.6-((i%2)*0.3),0,6.283); ctx.fill(); }
  ctx.fillStyle='rgba(180,190,215,.6)';
  ctx.fillRect(-9,6,18,1.6);
}
// 5. Фрустула диатомеи — эпитека/гипотека + поры-ареолы, как крышка Петри
function drawDiatomFrustule(ctx,now){
  const spin=now/4000;
  ctx.save(); ctx.rotate(spin*0.3);
  ctx.strokeStyle='hsla(190,60%,70%,.7)'; ctx.lineWidth=0.5;
  ctx.beginPath(); ctx.arc(0,-1,7,0,6.283); ctx.stroke();
  ctx.strokeStyle='hsla(190,50%,55%,.5)'; ctx.lineWidth=0.35;
  ctx.beginPath(); ctx.arc(0,2,5.6,0,6.283); ctx.stroke();
  for(let ring=1;ring<=3;ring++){
    const r=ring*1.7;
    const n=Math.round(6*ring);
    for(let i=0;i<n;i++){
      const a=i/n*6.283+ring*0.3;
      const x=Math.cos(a)*r, y=Math.sin(a)*r*0.85-0.5;
      ctx.fillStyle='hsla(195,70%,75%,.55)';
      ctx.beginPath(); ctx.arc(x,y,0.32,0,6.283); ctx.fill();
    }
  }
  ctx.restore();
}

mountCards([
  {id:'s1', name:'Хроматическая поляризация', body:'#1a0f14', drawFn:drawCalciteCross, zoom:6.5,
   fact:'Кальцит даёт чёрный крест в скрещенных поляризаторах (Араго 1811, механизм — Френель)',
   src:'CHROMATIC-POLARIZATION.md'},
  {id:'s2', name:'Фрактал Ляпунова', body:'#0f1218', drawFn:drawZirconZity, zoom:6.5,
   fact:'«Zircon Zity» — конкретный регион (Маркус/Хесс, 1989), жёлтый=порядок/синий=хаос',
   src:'LYAPUNOV-FRACTAL.md'},
  {id:'s3', name:'Little Red Dot', body:'#140a08', drawFn:drawLittleRedDot, zoom:6.5,
   fact:'Действующая загадка JWST — V-спектр с изломом на пределе Бальмера (3645Å)',
   src:'LITTLE-RED-DOTS.md'},
  {id:'s4', name:'Облака Ховарда', body:'#0e1420', drawFn:drawHowardClouds, zoom:6.5,
   fact:'Cirrus/cumulus/stratus — Гёте посвятил классификации 4 стихотворения (1817/1821)',
   src:'CLOUD-CLASSIFICATION-HOWARD.md'},
  {id:'s5', name:'Панцирь диатомеи', body:'#0a1418', drawFn:drawDiatomFrustule, zoom:6.5,
   fact:'Эпитека+гипотека как чашка Петри, поры-ареолы наноразмерные',
   src:'DIATOM-FRUSTULE-ENGINEERING.md'},
]);
</script>
