<title>Макет: стиль C на телефоне</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{ --text:#e8ecf7; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:#050508;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
.scr{min-height:100vh;padding:28px 18px 24px;display:flex;flex-direction:column;position:relative}
.vortex{position:absolute;inset:0;opacity:.5;pointer-events:none}
.brand{text-align:center;margin-bottom:18px}
.brandTitle{font-size:30px;font-weight:800;letter-spacing:.05em;color:#fff;text-shadow:0 0 14px rgba(120,220,255,.6),0 0 30px rgba(255,110,190,.35)}
.brandSub{font-size:13px;margin-top:4px;color:#8fd8ea}
.heroWrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;margin:18px 0}
.heroCard{width:100%;border-radius:20px;padding:22px;position:relative;overflow:hidden;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;background:transparent;border:1px solid;border-image:linear-gradient(135deg,#5ee7c8,#f0a5e0,#f0c866) 1;box-shadow:0 0 30px rgba(94,231,200,.18) inset}
.heroIcon{position:absolute;top:16px;right:16px;width:64px;height:64px}
.modeName{font-size:19px;font-weight:800;color:#fff}
.modeDesc{font-size:13px;line-height:1.4;margin-top:5px;color:#9db3c8}
.dots{display:flex;gap:7px;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:transparent;border:1px solid rgba(255,255,255,.3)}
.dot.on{background:#5ee7c8;border-color:#5ee7c8;box-shadow:0 0 8px #5ee7c8}
.konBtn{width:100%;border-radius:16px;padding:15px;text-align:center;font-size:15px;font-weight:700;margin-bottom:12px;background:transparent;border:1px solid #f0c866;color:#f0c866;box-shadow:0 0 14px rgba(240,200,102,.25)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ghostBtn{border-radius:14px;padding:14px 8px;text-align:center;font-size:13px;font-weight:600;background:transparent;border:1px solid rgba(255,255,255,.18);color:#cfe3ee}
.tag{position:fixed;top:8px;left:12px;font-size:10px;color:rgba(255,255,255,.35);z-index:5}
</style>
<div class="tag">МАКЕТ — вариант C, design-only</div>
<div class="scr">
  <svg class="vortex" viewBox="0 0 280 600" xmlns="http://www.w3.org/2000/svg">
    <g stroke="rgba(94,231,200,.22)" fill="none" stroke-width="1">
      <circle cx="140" cy="60" r="30"/><polygon points="140,24 170,80 110,80"/><polygon points="140,96 170,40 110,40"/>
    </g>
  </svg>
  <div class="brand">
    <div class="brandTitle">Cosmogram</div>
    <div class="brandSub">Одно небо для всех</div>
  </div>
  <div class="heroWrap">
    <div class="heroCard">
      <svg class="heroIcon" viewBox="0 0 54 54"><circle cx="27" cy="27" r="18" fill="none" stroke="#5ee7c8" stroke-width="1"/><circle cx="27" cy="27" r="10" fill="none" stroke="#f0a5e0" stroke-width="1"/><circle cx="27" cy="27" r="2" fill="#f0c866"/></svg>
      <div class="modeName">Score Attack</div>
      <div class="modeDesc">Лети, пока хватит жизней — свободный полёт без правил</div>
    </div>
    <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
  <div class="konBtn">Конструктор</div>
  <div class="grid2">
    <div class="ghostBtn">ТЮНИНГ</div><div class="ghostBtn">Достижения</div>
    <div class="ghostBtn">Равноправие</div><div class="ghostBtn">Благодарность</div>
    <div class="ghostBtn">Поддержка</div><div class="ghostBtn">Настройки</div>
  </div>
</div>
