<title>Макет: белый карлик — 5 тем</title>
<style>
:root{ --bg:#0b0e1a; --panel:#12172a; --panel-edge:#232c4a; --text:#e8ecf7; --text-dim:#8b93b3; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px}
h1{font-size:18px;margin:0 0 4px}
p.sub{color:var(--text-dim);font-size:12px;max-width:900px;margin:0 0 20px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:1100px}
.card{background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:12px;text-align:center}
.card canvas{width:100%;aspect-ratio:1;border-radius:10px;background:linear-gradient(180deg,#0a0e29 0%,#0e1a2a 55%,#0a1420 100%)}
.name{font-size:12px;font-weight:700;margin-top:8px}
.fact{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.4}
</style>
<h1>Белый карлик — 5 тем (честный шорт-лист файла)</h1>
<p class="sub">Каждая карточка — реальный факт из .knowledge/WHITE-DWARF-PHYSICS.md. На корпусе, живая анимация.</p>
<div class="grid" id="grid"></div>
<script>
const BODY_PTS=[[0,-22],[-16,14],[0,6],[16,14]];
function clipBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.clip(); }
function fillBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.fill(); }
function edgeStroke(ctx){
  ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1.1;
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.lineTo(-16,14); ctx.moveTo(0,-22); ctx.lineTo(16,14);
  ctx.moveTo(-16,14); ctx.lineTo(0,6); ctx.moveTo(0,6); ctx.lineTo(16,14);
  ctx.stroke();
}
function mountCards(items){
  const grid=document.getElementById('grid');
  items.forEach(({id,name,body,drawFn,zoom,fact})=>{
    const card=document.createElement('div'); card.className='card';
    const cv=document.createElement('canvas'); cv.id=id;
    const nm=document.createElement('div'); nm.className='name'; nm.textContent=name;
    const ft=document.createElement('div'); ft.className='fact'; ft.textContent=fact;
    card.appendChild(cv); card.appendChild(nm); card.appendChild(ft);
    grid.appendChild(card);
    loopFlash(cv,body,drawFn,zoom);
  });
}
function loopFlash(cv,bodyColor,drawFn,zoom){
  const ctx=cv.getContext('2d');
  function frame(now){
    const w=cv.clientWidth||160, h=cv.clientHeight||160;
    const dpr=Math.min(devicePixelRatio||1,2);
    if(cv._lw!==w||cv._lh!==h||cv._ld!==dpr){ cv.width=w*dpr; cv.height=h*dpr; cv._lw=w; cv._lh=h; cv._ld=dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    ctx.save(); ctx.translate(w/2,h/2); ctx.scale(zoom,zoom);
    ctx.save(); clipBody(ctx);
    const g=ctx.createLinearGradient(0,-22,0,16);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.45,bodyColor); g.addColorStop(1,'#0e1018');
    ctx.fillStyle=g; fillBody(ctx);
    ctx.restore();
    ctx.save(); clipBody(ctx); ctx.translate(0,-4);
    drawFn(ctx,now);
    ctx.restore();
    edgeStroke(ctx);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
// 1. BPM 37093 "Люси" — закристаллизованное углеродно-кислородное ядро, огранённые грани
function drawLucyDiamond(ctx,now){
  const p=(now%4000)/4000;
  const rot=p*2*Math.PI*0.2;
  ctx.save(); ctx.rotate(rot);
  for(let i=0;i<8;i++){
    const a=i/8*6.283;
    const shine=0.5+0.5*Math.sin(now/300+i);
    ctx.fillStyle='hsla(190,70%,'+(65+shine*20)+'%,'+(0.4+shine*0.4)+')';
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*9,Math.sin(a)*9); ctx.lineTo(Math.cos(a+0.78)*9,Math.sin(a+0.78)*9); ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=0.3; ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,1.5,0,6.283); ctx.fill();
}
// 2. Предел Чандрасекара — 1.4 массы Солнца, растущая масса пульсирует у самой грани коллапса
function drawChandrasekhar(ctx,now){
  const p=(now%2600)/2600;
  const mass=1.0+0.5*p; // растёт к 1.5, за пределом 1.4
  const overLimit = mass>1.4;
  const r=6+mass*3;
  ctx.fillStyle= overLimit? 'hsla(0,80%,55%,.85)' : 'hsla(50,80%,60%,.7)';
  ctx.beginPath(); ctx.arc(0,-2,r,0,6.283); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.setLineDash([1,2]); ctx.lineWidth=0.4;
  ctx.beginPath(); ctx.arc(0,-2,6+1.4*3,0,6.283); ctx.stroke(); ctx.setLineDash([]);
}
// 3. Плотность — чайная ложка вещества весит тонны (сжатое ядро, компактный яркий сгусток)
function drawDensity(ctx,now){
  const p=(now%2200)/2200;
  const pulse=0.7+0.3*Math.sin(p*2*Math.PI*3);
  const g=ctx.createRadialGradient(0,0,0,0,0,8);
  g.addColorStop(0,'hsla(210,90%,'+(75+pulse*15)+'%,1)'); g.addColorStop(0.4,'hsla(210,80%,55%,.6)'); g.addColorStop(1,'hsla(210,80%,40%,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,8,0,6.283); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,1.6*pulse,0,6.283); ctx.fill();
}
// 4. Загадка Сириуса B — яркая звезда + крошечный тусклый спутник по орбите
function drawSiriusB(ctx,now){
  const p=(now%5000)/5000;
  const ang=p*2*Math.PI;
  ctx.fillStyle='hsla(200,85%,85%,1)'; ctx.beginPath(); ctx.arc(-2,0,5,0,6.283); ctx.fill();
  const bx=-2+Math.cos(ang)*5.5, by=Math.sin(ang)*3;
  ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.beginPath(); ctx.ellipse(-2,0,5.5,3,0,0,6.283); ctx.stroke();
  ctx.fillStyle='hsla(210,60%,75%,.9)'; ctx.beginPath(); ctx.arc(bx,by,1,0,6.283); ctx.fill();
}
// 5. Обратная зависимость масса↔радиус — тяжелее значит меньше (два тела меняются местами)
function drawMassRadiusInverse(ctx,now){
  const p=(now%3000)/3000;
  const k=0.5+0.5*Math.sin(p*2*Math.PI);
  ctx.fillStyle='hsla(45,70%,60%,.7)'; ctx.beginPath(); ctx.arc(-6,-2,2+k*3,0,6.283); ctx.fill();
  ctx.fillStyle='hsla(210,70%,60%,.7)'; ctx.beginPath(); ctx.arc(6,-2,5-k*3,0,6.283); ctx.fill();
}

mountCards([
  {id:'w1', name:'BPM 37093 — «Люси»', body:'#0e1420', drawFn:drawLucyDiamond, zoom:6.5, fact:'Закристаллизовавшееся углеродно-кислородное ядро — настоящий «алмаз» звёздных масштабов'},
  {id:'w2', name:'Предел Чандрасекара', body:'#161008', drawFn:drawChandrasekhar, zoom:6.5, fact:'1.4 массы Солнца — Эддингтон vs Чандрасекар, Нобель дошёл только в 1983'},
  {id:'w3', name:'Плотность вещества', body:'#0c1422', drawFn:drawDensity, zoom:6.5, fact:'≈1.8 т/см³ — чайная ложка весит как машина'},
  {id:'w4', name:'Загадка Сириуса B', body:'#101828', drawFn:drawSiriusB, zoom:6.5, fact:'Масса как у Солнца, размер как у Земли — разгадано только квантовой механикой'},
  {id:'w5', name:'Масса↔радиус наоборот', body:'#181410', drawFn:drawMassRadiusInverse, zoom:6.5, fact:'Чем тяжелее белый карлик — тем он МЕНЬШЕ, не больше'},
]);
</script>
