<title>Макет: магнитосфера Земли — 10 тем</title>
<style>
:root{ --bg:#0b0e1a; --panel:#12172a; --panel-edge:#232c4a; --text:#e8ecf7; --text-dim:#8b93b3; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px}
h1{font-size:18px;margin:0 0 4px}
p.sub{color:var(--text-dim);font-size:12px;max-width:900px;margin:0 0 20px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:1100px}
.card{background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:12px;text-align:center}
.card canvas{width:100%;aspect-ratio:1;border-radius:10px;background:linear-gradient(180deg,#0a0e29 0%,#0e1a2a 55%,#0a1420 100%)}
.name{font-size:12px;font-weight:700;margin-top:8px}
.fact{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.4}
</style>
<h1>Магнитосфера Земли — 10 тем (MAGNETOSPHERE-PHYSICS.md)</h1>
<p class="sub">Тема 6 из 10. Найдено из твоего референса (форма «сегодня» vs «экскурс Лашам»), проверено WebSearch. Щит не статичен — сжимается от солнечного ветра, а 41000 лет назад почти рухнул на 2000 лет.</p>
<div class="grid" id="grid"></div>
<script>
const BODY_PTS=[[0,-22],[-16,14],[0,6],[16,14]];
function clipBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.clip(); }
function fillBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.fill(); }
function edgeStroke(ctx){
  ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1.1;
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.lineTo(-16,14); ctx.moveTo(0,-22); ctx.lineTo(16,14);
  ctx.moveTo(-16,14); ctx.lineTo(0,6); ctx.moveTo(0,6); ctx.lineTo(16,14);
  ctx.stroke();
}
function mountCards(items){
  const grid=document.getElementById('grid');
  items.forEach(({id,name,body,drawFn,zoom,fact})=>{
    const card=document.createElement('div'); card.className='card';
    const cv=document.createElement('canvas'); cv.id=id;
    const nm=document.createElement('div'); nm.className='name'; nm.textContent=name;
    const ft=document.createElement('div'); ft.className='fact'; ft.textContent=fact;
    card.appendChild(cv); card.appendChild(nm); card.appendChild(ft);
    grid.appendChild(card);
    loopFlash(cv,body,drawFn,zoom);
  });
}
function loopFlash(cv,bodyColor,drawFn,zoom){
  const ctx=cv.getContext('2d');
  function frame(now){
    const w=cv.clientWidth||160, h=cv.clientHeight||160;
    const dpr=Math.min(devicePixelRatio||1,2);
    if(cv._lw!==w||cv._lh!==h||cv._ld!==dpr){ cv.width=w*dpr; cv.height=h*dpr; cv._lw=w; cv._lh=h; cv._ld=dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    ctx.save(); ctx.translate(w/2,h/2); ctx.scale(zoom,zoom);
    ctx.save(); clipBody(ctx);
    const g=ctx.createLinearGradient(0,-22,0,16);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.45,bodyColor); g.addColorStop(1,'#0e1018');
    ctx.fillStyle=g; fillBody(ctx);
    ctx.restore();
    ctx.save(); clipBody(ctx); ctx.translate(0,-4);
    drawFn(ctx,now);
    ctx.restore();
    edgeStroke(ctx);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
// 1. Нормальная форма — сжата с солнечной стороны (~10 R⊕), вытянута с ночной
function drawNormalMagnetosphere(ctx,now){
  const p=0.5+0.5*Math.sin(now/900);
  ctx.fillStyle='hsla(200,50%,'+(65+p*10)+'%,1)'; ctx.beginPath(); ctx.arc(0,-2,1.4,0,6.283); ctx.fill();
  ctx.strokeStyle='hsla(190,70%,65%,'+(0.4+p*0.2)+')'; ctx.lineWidth=0.6;
  ctx.beginPath(); ctx.moveTo(-3,-7); ctx.quadraticCurveTo(-4.5,-2,-3,4); ctx.quadraticCurveTo(3,6,7,0); ctx.quadraticCurveTo(3,-6,-3,-7); ctx.stroke();
}
// 2. Хвост-шлейф — вытянут на сотни радиусов Земли в противоположную от Солнца сторону
function drawMagnetotail(ctx,now){
  ctx.fillStyle='hsla(200,50%,70%,1)'; ctx.beginPath(); ctx.arc(-3,-2,1.2,0,6.283); ctx.fill();
  const p=(now%2000)/2000;
  for(let i=0;i<6;i++){
    ctx.strokeStyle='hsla(190,60%,65%,'+(0.35-i*0.05)+')'; ctx.lineWidth=0.4;
    ctx.beginPath(); ctx.moveTo(-2+i*0.3,-4); ctx.lineTo(6+p*1.5,-3.5+i*0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2+i*0.3,0); ctx.lineTo(6+p*1.5,0.5-i*0.3); ctx.stroke();
  }
}
// 3. Экскурс Лашам — поле ослабло до ~10% силы, хаотичное, слабое свечение
function drawLaschampWeak(ctx,now){
  const p=0.5+0.5*Math.sin(now/600);
  ctx.fillStyle='hsla(0,30%,50%,'+(0.3+p*0.15)+')'; ctx.beginPath(); ctx.arc(0,-2,1.2,0,6.283); ctx.fill();
  ctx.strokeStyle='hsla(0,40%,55%,'+(0.15+p*0.1)+')'; ctx.lineWidth=0.35;
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(0,-2,2+i*1.4,0,6.283); ctx.stroke(); }
}
// 4. Мультипольное поле — несколько слабых полюсов вместо одного диполя
function drawMultipolarField(ctx,now){
  const seeds=[[-3,-4],[2,-5],[3,1],[-2,3],[0,-1]];
  seeds.forEach(([dx,dy],i)=>{
    const p=0.5+0.5*Math.sin(now/500+i*1.3);
    ctx.strokeStyle='hsla('+(280+i*20)+',50%,60%,'+(0.3+p*0.2)+')'; ctx.lineWidth=0.35;
    ctx.beginPath(); ctx.arc(dx,dy-2,1.1,0,6.283); ctx.stroke();
  });
}
// 5. Овал сияний сместился к экватору — светящаяся полоса не у полюса, а посередине
function drawAuroraShift(ctx,now){
  const p=0.5+0.5*Math.sin(now/400);
  const g=ctx.createLinearGradient(-7,-2,7,-2);
  g.addColorStop(0,'hsla(140,80%,60%,0)'); g.addColorStop(0.5,'hsla(140,85%,'+(55+p*15)+'%,.55)'); g.addColorStop(1,'hsla(140,80%,60%,0)');
  ctx.fillStyle=g; ctx.fillRect(-7,-2.6,14,1.2);
}
// 6. Пояса Ван Аллена — два кольца захваченных частиц, открыты в 1958 (Explorer 1)
function drawVanAllenBelts(ctx,now){
  ctx.fillStyle='hsla(200,40%,75%,1)'; ctx.beginPath(); ctx.arc(0,-2,1.3,0,6.283); ctx.fill();
  ctx.strokeStyle='hsla(50,80%,65%,.5)'; ctx.lineWidth=1.1;
  ctx.beginPath(); ctx.ellipse(0,-2,2.8,1.4,0,0,6.283); ctx.stroke();
  ctx.strokeStyle='hsla(30,80%,60%,.4)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.ellipse(0,-2,5,2.4,0,0,6.283); ctx.stroke();
  const a1=now/700, a2=now/1100+2;
  ctx.fillStyle='hsla(50,90%,80%,.9)'; ctx.beginPath(); ctx.arc(Math.cos(a1)*2.8,-2+Math.sin(a1)*1.4,0.16,0,6.283); ctx.fill();
  ctx.fillStyle='hsla(30,90%,75%,.85)'; ctx.beginPath(); ctx.arc(Math.cos(a2)*5,-2+Math.sin(a2)*2.4,0.18,0,6.283); ctx.fill();
}
// 7. Головной ударный фронт (bow shock) — гиперболический щит перед магнитосферой
function drawBowShock(ctx,now){
  ctx.fillStyle='hsla(200,50%,70%,1)'; ctx.beginPath(); ctx.arc(0,0,1.2,0,6.283); ctx.fill();
  ctx.strokeStyle='hsla(30,70%,65%,.55)'; ctx.lineWidth=0.6;
  ctx.beginPath(); ctx.moveTo(-5,-9); ctx.quadraticCurveTo(-2,0,-5,9); ctx.stroke();
  const p=(now%1500)/1500;
  for(let i=0;i<3;i++){ ctx.fillStyle='hsla(30,80%,70%,'+(0.4-i*0.1)+')'; ctx.beginPath(); ctx.arc(-6-p*1.5-i*1.5,0,0.25,0,6.283); ctx.fill(); }
}
// 8. Плазмосфера — внутренняя область холодной плазмы, вращающаяся вместе с Землёй
function drawPlasmasphere(ctx,now){
  const p=0.5+0.5*Math.sin(now/700);
  const g=ctx.createRadialGradient(0,-2,0,0,-2,2.2);
  g.addColorStop(0,'hsla(260,60%,'+(65+p*10)+'%,.7)'); g.addColorStop(1,'hsla(260,60%,50%,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-2,2.2,0,6.283); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,-2,0.7,0,6.283); ctx.fill();
}
// 9. Сжатие от солнечного ветра — форма пульсирует, не статична
function drawCompressionDynamics(ctx,now){
  const p=0.5+0.5*Math.sin(now/900);
  ctx.fillStyle='hsla(200,50%,70%,1)'; ctx.beginPath(); ctx.arc(0,-2,1.2,0,6.283); ctx.fill();
  ctx.strokeStyle='hsla(190,60%,65%,.45)'; ctx.lineWidth=0.5;
  ctx.beginPath(); ctx.arc(0,-2,2.5+p*1.5,0,6.283); ctx.stroke();
}
// 10. Обычные дипольные линии поля — базовая форма для контраста с экскурсом
function drawDipoleLines(ctx,now){
  for(let i=1;i<=3;i++){
    const p=0.5+0.5*Math.sin(now/700+i);
    ctx.strokeStyle='hsla(210,60%,70%,'+(0.3+p*0.3)+')'; ctx.lineWidth=0.4;
    ctx.beginPath(); ctx.moveTo(0,-8); ctx.quadraticCurveTo(i*2.2,-2,0,7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,-8); ctx.quadraticCurveTo(-i*2.2,-2,0,7); ctx.stroke();
  }
}

mountCards([
  {id:'g1', name:'Нормальная форма', body:'#0c1420', drawFn:drawNormalMagnetosphere, zoom:6, fact:'Сжата до ≈10 радиусов Земли с солнечной стороны'},
  {id:'g2', name:'Хвост-шлейф', body:'#0c1420', drawFn:drawMagnetotail, zoom:6, fact:'Вытянут на сотни радиусов Земли — «как след за лодкой»'},
  {id:'g3', name:'Экскурс Лашам', body:'#181008', drawFn:drawLaschampWeak, zoom:6, fact:'≈41000 лет назад поле ослабло до ~10% силы на 2000 лет'},
  {id:'g4', name:'Мультипольное поле', body:'#140c18', drawFn:drawMultipolarField, zoom:6, fact:'Во время экскурса — несколько слабых полюсов вместо диполя'},
  {id:'g5', name:'Сияния у экватора', body:'#0a1810', drawFn:drawAuroraShift, zoom:6, fact:'2024-2025: овал сияний сместился к экватору во время сбоя'},
  {id:'g6', name:'Пояса Ван Аллена', body:'#0e1420', drawFn:drawVanAllenBelts, zoom:6, fact:'Открыты в 1958 первым спутником США Explorer 1'},
  {id:'g7', name:'Головной ударный фронт', body:'#161006', drawFn:drawBowShock, zoom:6, fact:'Солнечный ветер бьёт о щит первым, на ≈11-15 радиусах'},
  {id:'g8', name:'Плазмосфера', body:'#100c1c', drawFn:drawPlasmasphere, zoom:6, fact:'Внутренняя область холодной плазмы, вращается вместе с Землёй'},
  {id:'g9', name:'Сжатие от ветра', body:'#0c1420', drawFn:drawCompressionDynamics, zoom:6, fact:'Форма не постоянна — пульсирует от давления солнечного ветра'},
  {id:'g10', name:'Дипольные линии', body:'#0e1220', drawFn:drawDipoleLines, zoom:6, fact:'Обычная форма поля — как у стержневого магнита, полюс к полюсу'},
]);
</script>
