<title>Макет: солнечная активность — 10 тем</title>
<style>
:root{ --bg:#0b0e1a; --panel:#12172a; --panel-edge:#232c4a; --text:#e8ecf7; --text-dim:#8b93b3; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px}
h1{font-size:18px;margin:0 0 4px}
p.sub{color:var(--text-dim);font-size:12px;max-width:900px;margin:0 0 20px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:1100px}
.card{background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:12px;text-align:center}
.card canvas{width:100%;aspect-ratio:1;border-radius:10px;background:linear-gradient(180deg,#0a0e29 0%,#0e1a2a 55%,#0a1420 100%)}
.name{font-size:12px;font-weight:700;margin-top:8px}
.fact{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.4}
</style>
<h1>Солнечная активность — 10 тем (SOLAR-ACTIVITY-CYCLE.md)</h1>
<p class="sub">Тема 9 из 10. Магнитный двигатель Солнца — пятна (объективно яркие!), два вложенных цикла (11 и 22 года), логарифмическая шкала вспышек, вспышка честно ≠ выброс массы.</p>
<div class="grid" id="grid"></div>
<script>
const BODY_PTS=[[0,-22],[-16,14],[0,6],[16,14]];
function clipBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.clip(); }
function fillBody(ctx){ ctx.beginPath(); BODY_PTS.forEach(([x,y],i)=>i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)); ctx.closePath(); ctx.fill(); }
function edgeStroke(ctx){
  ctx.strokeStyle='rgba(255,255,255,.32)'; ctx.lineWidth=1.1;
  ctx.beginPath();
  ctx.moveTo(0,-22); ctx.lineTo(-16,14); ctx.moveTo(0,-22); ctx.lineTo(16,14);
  ctx.moveTo(-16,14); ctx.lineTo(0,6); ctx.moveTo(0,6); ctx.lineTo(16,14);
  ctx.stroke();
}
function mountCards(items){
  const grid=document.getElementById('grid');
  items.forEach(({id,name,body,drawFn,zoom,fact})=>{
    const card=document.createElement('div'); card.className='card';
    const cv=document.createElement('canvas'); cv.id=id;
    const nm=document.createElement('div'); nm.className='name'; nm.textContent=name;
    const ft=document.createElement('div'); ft.className='fact'; ft.textContent=fact;
    card.appendChild(cv); card.appendChild(nm); card.appendChild(ft);
    grid.appendChild(card);
    loopFlash(cv,body,drawFn,zoom);
  });
}
function loopFlash(cv,bodyColor,drawFn,zoom){
  const ctx=cv.getContext('2d');
  function frame(now){
    const w=cv.clientWidth||160, h=cv.clientHeight||160;
    const dpr=Math.min(devicePixelRatio||1,2);
    if(cv._lw!==w||cv._lh!==h||cv._ld!==dpr){ cv.width=w*dpr; cv.height=h*dpr; cv._lw=w; cv._lh=h; cv._ld=dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    ctx.save(); ctx.translate(w/2,h/2); ctx.scale(zoom,zoom);
    ctx.save(); clipBody(ctx);
    const g=ctx.createLinearGradient(0,-22,0,16);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.45,bodyColor); g.addColorStop(1,'#0e1018');
    ctx.fillStyle=g; fillBody(ctx);
    ctx.restore();
    ctx.save(); clipBody(ctx); ctx.translate(0,-4);
    drawFn(ctx,now);
    ctx.restore();
    edgeStroke(ctx);
    ctx.restore();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
// 1. Пятно "тёмное" только по контрасту — объективно раскалено, (T_умбра/T_фотосфера)^4 ≈ 18%
function drawSunspotContrast(ctx,now){
  const p=0.5+0.5*Math.sin(now/1200);
  ctx.fillStyle='hsla(45,90%,65%,1)'; ctx.beginPath(); ctx.arc(0,-2,5,0,6.283); ctx.fill();
  ctx.fillStyle='hsla(20,70%,'+(20+p*25)+'%,1)'; ctx.beginPath(); ctx.arc(0,-2,2,0,6.283); ctx.fill();
}
// 2. Магнитное поле пятна — тысячи гаусс, в тысячи раз сильнее земного, линии концентрируются
function drawSunspotMagnetic(ctx,now){
  ctx.fillStyle='hsla(20,60%,30%,1)'; ctx.beginPath(); ctx.arc(0,-2,2.2,0,6.283); ctx.fill();
  for(let i=0;i<8;i++){
    const a=i/8*6.283+now/2000;
    const p=0.5+0.5*Math.sin(now/300+i);
    ctx.strokeStyle='hsla(280,60%,70%,'+(0.2+p*0.2)+')'; ctx.lineWidth=0.3;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*2.3,-2+Math.sin(a)*2.3); ctx.lineTo(Math.cos(a)*4.5,-2+Math.sin(a)*4.5); ctx.stroke();
  }
}
// 3. Умбра/пенумбра — тёмный центр, волокнистое светлое кольцо с наклонным полем
function drawUmbraPenumbra(ctx,now){
  const p=0.5+0.5*Math.sin(now/1300);
  ctx.fillStyle='hsla(30,60%,'+(50+p*8)+'%,.8)'; ctx.beginPath(); ctx.arc(0,-2,4,0,6.283); ctx.fill();
  for(let i=0;i<16;i++){ const a=i/16*6.283+now/6000; ctx.strokeStyle='hsla(20,50%,40%,.5)'; ctx.lineWidth=0.25;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*1.9,-2+Math.sin(a)*1.9); ctx.lineTo(Math.cos(a)*3.9,-2+Math.sin(a)*3.9); ctx.stroke(); }
  ctx.fillStyle='hsla(20,70%,25%,1)'; ctx.beginPath(); ctx.arc(0,-2,1.9,0,6.283); ctx.fill();
}
// 4. Цикл Швабе — 11 лет, число пятен то растёт, то падает
function drawSchwabeCycle(ctx,now){
  const p=(now%3000)/3000;
  const count=Math.round(3+3*Math.sin(p*6.283));
  for(let i=0;i<count;i++){
    const a=i/Math.max(count,1)*6.283;
    ctx.fillStyle='hsla(30,70%,45%,.8)'; ctx.beginPath(); ctx.arc(Math.cos(a)*2.2,-2+Math.sin(a)*2.2,0.35,0,6.283); ctx.fill();
  }
}
// 5. Цикл Хейла — 22 года, магнитная полярность разворачивается через один 11-летний цикл
function drawHaleCycle(ctx,now){
  const p=(now%4000)/4000;
  const flipped = p>0.5;
  ctx.fillStyle='hsla('+(flipped?200:15)+',70%,55%,.6)'; ctx.beginPath(); ctx.arc(-1.5,-2,1.3,0,6.283); ctx.fill();
  ctx.fillStyle='hsla('+(flipped?15:200)+',70%,55%,.6)'; ctx.beginPath(); ctx.arc(1.5,-2,1.3,0,6.283); ctx.fill();
}
// 6. Классификация вспышек A-B-C-M-X — логарифмическая шкала, каждая буква в 10 раз мощнее
function drawFlareClasses(ctx,now){
  const letters=[0.3,0.6,1.1,1.9,3];
  letters.forEach((r,i)=>{
    const p=0.5+0.5*Math.sin(now/400+i*1.5);
    ctx.fillStyle='hsla('+(50-i*10)+',85%,'+(55+p*15)+'%,'+(0.3+i*0.12)+')';
    ctx.beginPath(); ctx.arc(-4+i*2,-2,r*0.5,0,6.283); ctx.fill();
  });
}
// 7. Хэллоуинские бури 2003 — сильнейшая вспышка X17-X45, засветила датчик GOES
function drawHalloweenFlare(ctx,now){
  const p=(now%900)/900;
  const flash=p<0.3? 1-p/0.3 : 0;
  ctx.fillStyle='hsla(45,95%,'+(60+flash*35)+'%,'+(0.6+flash*0.4)+')'; ctx.beginPath(); ctx.arc(0,-2,1+flash*3,0,6.283); ctx.fill();
  for(let i=0;i<6;i++){ const a=i/6*6.283; ctx.strokeStyle='hsla(45,90%,80%,'+(flash*0.6)+')'; ctx.lineWidth=0.4;
    ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(Math.cos(a)*(2+flash*4),-2+Math.sin(a)*(2+flash*4)); ctx.stroke(); }
}
// 8. КВМ (CME) — физически другое явление: облако вещества расширяется, а не точечная вспышка
function drawCME(ctx,now){
  const p=(now%2800)/2800;
  const r=1+p*7;
  ctx.strokeStyle='hsla(20,70%,60%,'+(0.5-p*0.4)+')'; ctx.lineWidth=0.6;
  ctx.beginPath(); ctx.arc(0,-2,r,0,6.283); ctx.stroke();
  ctx.fillStyle='hsla(20,80%,60%,'+(0.4-p*0.3)+')'; ctx.beginPath(); ctx.arc(0,-2,r,0,6.283); ctx.fill();
}
// 9. Квебек 1989 — реальное отключение сети через 90 секунд после удара бури
function drawQuebecBlackout(ctx,now){
  const p=(now%2000)/2000;
  const on = p<0.7;
  ctx.strokeStyle='hsla(50,90%,70%,'+(on?0.6:0.08)+')'; ctx.lineWidth=0.35;
  for(let i=0;i<4;i++){ ctx.beginPath(); ctx.moveTo(-5,-5+i*2.5); ctx.lineTo(5,-5+i*2.5); ctx.stroke(); }
}
// 10. Солнечный протуберанец — арка плазмы вдоль магнитных линий, до 800000км
function drawSolarProminence(ctx,now){
  const p=(now%3000)/3000;
  ctx.strokeStyle='hsla(0,80%,60%,.6)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(-3.5,3); ctx.quadraticCurveTo(0,-7-p*0.6,3.5,3); ctx.stroke();
  for(let i=0;i<10;i++){ const t=i/10; const x=-3.5+t*7, y=3+Math.sin(t*3.14)*(-10-p*0.6*0)*0; }
}

mountCards([
  {id:'a1', name:'Пятно: тёмное лишь на вид', body:'#161006', drawFn:drawSunspotContrast, zoom:6, fact:'На самом деле раскалено — тёмное только рядом с ещё более ярким фоном'},
  {id:'a2', name:'Магнитное поле пятна', body:'#100c1a', drawFn:drawSunspotMagnetic, zoom:6, fact:'В тысячи раз сильнее магнитного поля Земли'},
  {id:'a3', name:'Умбра и пенумбра', body:'#141008', drawFn:drawUmbraPenumbra, zoom:6, fact:'Волокнистое кольцо — поле там слабее и наклонено, не вертикально'},
  {id:'a4', name:'Цикл Швабе (11 лет)', body:'#181206', drawFn:drawSchwabeCycle, zoom:6, fact:'Число пятен циклически растёт и падает — открыто в 1843'},
  {id:'a5', name:'Цикл Хейла (22 года)', body:'#0c1220', drawFn:drawHaleCycle, zoom:6, fact:'Полная смена магнитной полярности — два цикла Швабе подряд'},
  {id:'a6', name:'Классы вспышек A-B-C-M-X', body:'#161006', drawFn:drawFlareClasses, zoom:6, fact:'Логарифмическая шкала — каждая буква в 10 раз мощнее предыдущей'},
  {id:'a7', name:'Хэллоуинская буря 2003', body:'#181004', drawFn:drawHalloweenFlare, zoom:6, fact:'X17-X45 — сильнейшая вспышка, датчик GOES не выдержал измерения'},
  {id:'a8', name:'Корональный выброс массы', body:'#140c08', drawFn:drawCME, zoom:6, fact:'Настоящее облако вещества — физически другое явление, чем вспышка'},
  {id:'a9', name:'Отключение Квебека 1989', body:'#0a0a10', drawFn:drawQuebecBlackout, zoom:6, fact:'Сеть рухнула через 90 секунд — без электричества 6 млн человек'},
  {id:'a10', name:'Солнечный протуберанец', body:'#120a08', drawFn:drawSolarProminence, zoom:5.5, fact:'Арка плазмы вдоль магнитных линий — до 800000 км в длину'},
]);
</script>
