<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{background:#0c0f24;margin:0;padding:40px;font-family:sans-serif;color:#fff;display:flex;gap:60px;justify-content:center}
  .col{text-align:center}
  h3{font-weight:400;color:#cfd6ff;margin:0 0 14px}
  canvas{width:180px;height:180px;background:radial-gradient(circle,#2a2560 0%,#161230 70%,#0c0f24 100%);border-radius:14px;border:1px solid #3a3570}
</style></head>
<body>
  <div class="col"><h3>Было (нос под кругом)</h3><canvas id="a" width="52" height="52"></canvas></div>
  <div class="col"><h3>Нос поверх — не помогло<br>(цвета почти совпадают)</h3><canvas id="b" width="52" height="52"></canvas></div>
  <div class="col"><h3>Нос поверх + круг меньше</h3><canvas id="c" width="52" height="52"></canvas></div>
<script>
// цвет — как в реальной игре: glow текущего скина корабля, здесь взят близкий к скриншоту розовый
const col = a => 'rgba(255,120,190,' + Math.max(0,a).toFixed(2) + ')';

function drawNose(x){ // дословно ui.js:2043-2045 — белый треугольник-ориентир
  x.fillStyle='#eaf2ff'; x.globalAlpha=.9;
  x.beginPath(); x.moveTo(26,14); x.lineTo(21,25); x.lineTo(26,22); x.lineTo(31,25); x.closePath(); x.fill();
  x.globalAlpha=1;
}
function drawSparks(x){ // дословно render.js:3831-3835 — сама вспышка не трогаем
  x.fillStyle='rgba(255,255,255,.9)'; x.beginPath(); x.arc(2,10,4.5,0,6.2832); x.fill();
  [[-3,18,1.6,.7],[3,26,1.3,.55],[-4,34,1.8,.4],[1,44,1.1,.25]].forEach(([px,py,r,a])=>{
    x.fillStyle=col(a); x.beginPath(); x.arc(px,py,r,0,6.2832); x.fill();
  });
}

// Было: ui.js рисует нос ДО setTransform для следа — круг вспышки ложится поверх носа и полностью его закрывает (совпадают и по месту, и по цвету)
const a = document.getElementById('a').getContext('2d');
drawNose(a); a.setTransform(1.55,0,0,1.55,26,4); drawSparks(a);

// Нос поверх, вспышка та же — цвета слишком похожи, разницы почти не видно
const b = document.getElementById('b').getContext('2d');
b.setTransform(1.55,0,0,1.55,26,4); drawSparks(b);
b.setTransform(1,0,0,1,0,0); drawNose(b);

// Нос поверх + радиус вспышки меньше (пример: 4.5→2.2) — силуэт носа читается на просвет
function drawSparksSmallFlash(x){
  x.fillStyle='rgba(255,255,255,.9)'; x.beginPath(); x.arc(2,10,2.2,0,6.2832); x.fill();
  [[-3,18,1.6,.7],[3,26,1.3,.55],[-4,34,1.8,.4],[1,44,1.1,.25]].forEach(([px,py,r,a])=>{
    x.fillStyle=col(a); x.beginPath(); x.arc(px,py,r,0,6.2832); x.fill();
  });
}
const c = document.getElementById('c').getContext('2d');
c.setTransform(1.55,0,0,1.55,26,4); drawSparksSmallFlash(c);
c.setTransform(1,0,0,1,0,0); drawNose(c);
</script>
</body></html>
